<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Inward - Smart Gate Security</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .form-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-container h2 {
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
    }
    label .required {
      color: #e53e3e;
      margin-left: 2px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .file-upload {
      border: 2px dashed #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-upload:hover {
      border-color: #667eea;
    }
    .file-upload input {
      display: none;
    }
    .section-divider {
      border-top: 1px solid #e2e8f0;
      margin: 24px 0;
    }
    .hidden-field {
      display: none;
    }
    .gate-info {
      background: #ebf8ff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #2b6cb0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Material Inward</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="form-container">
      <h2>Register Inward Material</h2>
      <div class="success" id="successMsg">Entry created successfully!</div>
      <div class="error" id="errorMsg"></div>
      
      <div class="gate-info" id="gateInfo">
        Entry Gate: <span id="currentGate">-</span>
      </div>

      <form id="inwardForm">
        <div class="form-group">
          <label for="prPoNumber">PR/PO Number</label>
          <input type="text" id="prPoNumber" placeholder="Enter PR/PO number">
        </div>

        <div class="form-group">
          <label for="assetBelongsTo">Asset Belongs To<span class="required">*</span></label>
          <select id="assetBelongsTo" required>
            <option value="">Select asset belongs to</option>
            <option value="CtrlS">CtrlS</option>
            <option value="Customer">Customer</option>
            <option value="Project">Project</option>
          </select>
        </div>

        <div class="form-group">
          <label for="typeOfInward">Type of Inward<span class="required">*</span></label>
          <select id="typeOfInward" required>
            <option value="">Select type of inward</option>
            <option value="Inward Non Returnable">Inward Non Returnable</option>
            <option value="Inward Returnable">Inward Returnable</option>
            <option value="Internal Movement Inward">Internal Movement Inward</option>
          </select>
        </div>

        <div class="form-group hidden-field" id="customerNameGroup">
          <label for="customerName">Customer Name<span class="required">*</span></label>
          <select id="customerName">
            <option value="">Select customer</option>
          </select>
        </div>

        <div class="section-divider"></div>

        <div class="form-group">
          <label for="requesterName">Requester Name<span class="required">*</span></label>
          <input type="text" id="requesterName" placeholder="Enter requester name" required>
        </div>

        <div class="form-group">
          <label for="requesterEmail">Requester Email<span class="required">*</span></label>
          <input type="email" id="requesterEmail" placeholder="Enter requester email" required>
        </div>

        <div class="form-group">
          <label for="departmentName">Department Name</label>
          <input type="text" id="departmentName" placeholder="Enter department name">
        </div>

        <div class="form-group">
          <label for="shipmentNumber">Shipment Number</label>
          <input type="text" id="shipmentNumber" placeholder="Enter shipment number">
        </div>

        <div class="section-divider"></div>

        <div class="form-group">
          <label for="vehicleNumber">Vehicle Number<span class="required">*</span></label>
          <input type="text" id="vehicleNumber" placeholder="Enter vehicle number" required>
        </div>

        <div class="form-group">
          <label for="vendorName">Vendor Name<span class="required">*</span></label>
          <select id="vendorName" required>
            <option value="">Select vendor</option>
          </select>
        </div>

        <div class="form-group">
          <label for="invoiceDcNumber">Invoice / DC Number<span class="required">*</span></label>
          <input type="text" id="invoiceDcNumber" placeholder="Enter invoice/DC number" required>
        </div>

        <div class="form-group">
          <label for="invoiceValue">Invoice Value (₹)<span class="required">*</span></label>
          <input type="number" id="invoiceValue" placeholder="Enter invoice value" step="0.01" min="0" required>
        </div>

        <div class="form-group">
          <label for="itemsQty">Items Qty<span class="required">*</span></label>
          <input type="number" id="itemsQty" placeholder="Enter quantity" min="1" required>
        </div>

        <div class="form-group">
          <label for="materialDescription">Material Description<span class="required">*</span></label>
          <select id="materialDescription" required>
            <option value="">Select material description</option>
            <option value="As per attached DC">As per attached DC</option>
          </select>
        </div>

        <div class="form-group">
          <label for="entrySerialNumber">Entry Serial Number<span class="required">*</span></label>
          <input type="text" id="entrySerialNumber" placeholder="Enter entry serial number" required>
        </div>

        <div class="form-group">
          <label for="remarks">Remarks</label>
          <textarea id="remarks" placeholder="Enter remarks"></textarea>
        </div>

        <div class="section-divider"></div>

        <div class="form-group">
          <label>Document (PDF only, max 10MB)</label>
          <div class="file-upload" id="fileUpload">
            <p>Click to upload or drag and drop</p>
            <p style="color: #718096; font-size: 12px; margin-top: 8px;">PDF only, 10MB max</p>
            <input type="file" id="document" accept=".pdf">
          </div>
          <p id="fileName" style="margin-top: 8px; color: #4a5568;"></p>
        </div>

        <button type="submit">Submit Entry</button>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    const user = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('currentGate').textContent = user.gateNumber || user.username || 'Gate';

    const fileUpload = document.getElementById('fileUpload');
    const fileInput = document.getElementById('document');
    const fileName = document.getElementById('fileName');
    const assetBelongsTo = document.getElementById('assetBelongsTo');
    const typeOfInward = document.getElementById('typeOfInward');
    const customerNameGroup = document.getElementById('customerNameGroup');
    const customerNameSelect = document.getElementById('customerName');
    const vendorNameSelect = document.getElementById('vendorName');

    fileUpload.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        if (file.type !== 'application/pdf') {
          alert('Only PDF files are allowed');
          fileInput.value = '';
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          alert('File size must be less than 10MB');
          fileInput.value = '';
          return;
        }
        fileName.textContent = file.name;
      }
    });

    assetBelongsTo.addEventListener('change', (e) => {
      const value = e.target.value;
      
      if (value === 'Customer') {
        customerNameGroup.classList.remove('hidden-field');
        customerNameSelect.required = true;
        typeOfInward.value = 'Inward Non Returnable';
        typeOfInward.disabled = true;
      } else {
        customerNameGroup.classList.add('hidden-field');
        customerNameSelect.required = false;
        customerNameSelect.value = '';
        typeOfInward.disabled = false;
      }
    });

    async function loadCustomers() {
      try {
        const customers = await API.getCustomers();
        customerNameSelect.innerHTML = '<option value="">Select customer</option>';
        customers.forEach(customer => {
          const option = document.createElement('option');
          option.value = customer.name;
          option.textContent = customer.name;
          customerNameSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load customers:', error);
      }
    }

    async function loadVendors() {
      try {
        const vendors = await API.getMasterVendors();
        vendorNameSelect.innerHTML = '<option value="">Select vendor</option>';
        vendors.forEach(vendor => {
          const option = document.createElement('option');
          option.value = vendor.name;
          option.textContent = vendor.name;
          vendorNameSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Failed to load vendors:', error);
      }
    }

    loadCustomers();
    loadVendors();

    document.getElementById('inwardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      let documentBase64 = null;
      const docFile = document.getElementById('document').files[0];
      
      if (docFile) {
        documentBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(docFile);
        });
      }

      try {
        const customerName = assetBelongsTo.value === 'Customer' 
          ? document.getElementById('customerName').value 
          : null;

        const invoiceValue = document.getElementById('invoiceValue').value;
        const itemsQty = document.getElementById('itemsQty').value;

        await API.createMaterialInward({
          prPoNumber: document.getElementById('prPoNumber').value || null,
          assetBelongsTo: document.getElementById('assetBelongsTo').value,
          typeOfInward: document.getElementById('typeOfInward').value,
          customerName: customerName,
          requesterName: document.getElementById('requesterName').value,
          requesterEmail: document.getElementById('requesterEmail').value,
          departmentName: document.getElementById('departmentName').value || null,
          shipmentNumber: document.getElementById('shipmentNumber').value || null,
          vehicleNumber: document.getElementById('vehicleNumber').value,
          vendorName: document.getElementById('vendorName').value,
          invoiceDcNumber: document.getElementById('invoiceDcNumber').value,
          invoiceValue: invoiceValue ? parseFloat(invoiceValue) : 0,
          itemsQty: itemsQty ? parseInt(itemsQty) : 0,
          materialDescription: document.getElementById('materialDescription').value,
          entrySerialNumber: document.getElementById('entrySerialNumber').value,
          remarks: document.getElementById('remarks').value || null,
          document: documentBase64
        });

        successMsg.style.display = 'block';
        e.target.reset();
        fileName.textContent = '';
        customerNameGroup.classList.add('hidden-field');
        typeOfInward.disabled = false;
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);
      } catch (error) {
        errorMsg.textContent = error.message || 'Failed to create entry';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
