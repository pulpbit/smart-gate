<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Outward List - Smart Gate Security</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .card-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .detail {
      display: flex;
      flex-direction: column;
    }
    .detail-label {
      font-size: 12px;
      color: #718096;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: 500;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }
    .empty-state p {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Material Outward List</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div id="outwardList"></div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    let outwardItems = [];

    async function loadOutward() {
      try {
        outwardItems = await API.getMaterialOutward();
        renderOutward();
      } catch (error) {
        console.error('Failed to load outward materials:', error);
      }
    }

    function renderOutward() {
      const container = document.getElementById('outwardList');
      
      if (outwardItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No outward material entries yet</h3>
            <p>Register an outward material entry to see it here</p>
          </div>
        `;
        return;
      }

      container.innerHTML = outwardItems.map(item => `
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">DC: ${item.dc_number}</div>
              <div style="color: #718096; font-size: 14px; margin-top: 4px;">
                ${item.vendor_name}
              </div>
            </div>
          </div>
          <div class="card-details">
            <div class="detail">
              <span class="detail-label">DC Date</span>
              <span class="detail-value">${item.dc_date}</span>
            </div>
            <div class="detail">
              <span class="detail-label">Material Description</span>
              <span class="detail-value">${item.material_description || 'N/A'}</span>
            </div>
            <div class="detail">
              <span class="detail-label">Vehicle Number</span>
              <span class="detail-value">${item.vehicle_number || 'N/A'}</span>
            </div>
            <div class="detail">
              <span class="detail-label">Driver</span>
              <span class="detail-value">${item.driver_name || 'N/A'}</span>
            </div>
            <div class="detail">
              <span class="detail-label">Quantity</span>
              <span class="detail-value">${item.quantity || 'N/A'}</span>
            </div>
            <div class="detail">
              <span class="detail-label">Entry Time</span>
              <span class="detail-value">${new Date(item.created_at).toLocaleString()}</span>
            </div>
            <div class="detail">
              <span class="detail-label">Gate</span>
              <span class="detail-value">${item.gate_number || 'N/A'}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    loadOutward();
  </script>
</body>
</html>
