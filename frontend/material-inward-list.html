<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Inward List - Smart Gate Security</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (min-width: 768px) {
      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .search-box .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #718096;
      font-size: 18px;
    }
    .new-entry-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .new-entry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    @media (min-width: 768px) {
      .card-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
    }
    .card-title-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .card-subtitle {
      color: #718096;
      font-size: 14px;
    }
    .card-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      gap: 4px;
    }
    .badge-asset-ctrls {
      background: #e9d8fd;
      color: #6b46c1;
    }
    .badge-asset-customer {
      background: #fefcbf;
      color: #b7791f;
    }
    .badge-asset-project {
      background: #fed7d7;
      color: #c53030;
    }
    .badge-type-nonreturn {
      background: #c6f6d5;
      color: #276749;
    }
    .badge-type-return {
      background: #bee3f8;
      color: #2b6cb0;
    }
    .badge-type-internal {
      background: #f0fff4;
      color: #22543d;
    }
    .card-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 768px) {
      .card-details {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .detail {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .detail-label {
      font-size: 12px;
      color: #718096;
    }
    .detail-value {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: 500;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      color: #1a1a1a;
      margin-bottom: 8px;
      font-size: 20px;
    }
    .empty-state p {
      color: #718096;
      margin-bottom: 24px;
    }
    .empty-state .new-entry-btn {
      display: inline-flex;
    }
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }
    .no-results .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (min-width: 768px) {
      .stats-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    .stat-label {
      font-size: 14px;
      color: #718096;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Material Inward</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">Total Entries</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="ctrlsCount">0</span>
        <span class="stat-label">CtrlS</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="customerCount">0</span>
        <span class="stat-label">Customer</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="projectCount">0</span>
        <span class="stat-label">Project</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by DC, Vehicle, Vendor, Requester...">
      </div>
      <a href="material-inward.html" class="new-entry-btn">
        <span>➕</span>
        New Inward Entry
      </a>
    </div>

    <div id="inwardList"></div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    const user = JSON.parse(localStorage.getItem('user') || '{}');

    let inwardItems = [];
    let filteredItems = [];

    const assetBadgeClass = {
      'CtrlS': 'badge-asset-ctrls',
      'Customer': 'badge-asset-customer',
      'Project': 'badge-asset-project'
    };

    const typeBadgeClass = {
      'Inward Non Returnable': 'badge-type-nonreturn',
      'Inward Returnable': 'badge-type-return',
      'Internal Movement Inward': 'badge-type-internal'
    };

    async function loadInward() {
      try {
        inwardItems = await API.getMaterialInward();
        filteredItems = [...inwardItems];
        updateStats();
        renderInward();
      } catch (error) {
        console.error('Failed to load inward materials:', error);
        renderError(error);
      }
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = inwardItems.length;
      document.getElementById('ctrlsCount').textContent = inwardItems.filter(i => i.asset_belongs_to === 'CtrlS').length;
      document.getElementById('customerCount').textContent = inwardItems.filter(i => i.asset_belongs_to === 'Customer').length;
      document.getElementById('projectCount').textContent = inwardItems.filter(i => i.asset_belongs_to === 'Project').length;
    }

    function getItemField(item, field) {
      if (item[field] !== undefined && item[field] !== null) {
        return item[field];
      }
      const legacyField = field.replace(/_/g, '');
      if (item[legacyField] !== undefined && item[legacyField] !== null) {
        return item[legacyField];
      }
      return null;
    }

    function renderInward() {
      const container = document.getElementById('inwardList');
      
      if (inwardItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📦</div>
            <h3>No inward material entries yet</h3>
            <p>Register your first inward material entry to get started</p>
            <a href="material-inward.html" class="new-entry-btn">
              <span>➕</span>
              New Inward Entry
            </a>
          </div>
        `;
        return;
      }

      if (filteredItems.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <div class="icon">🔍</div>
            <h3>No results found</h3>
            <p>Try a different search term</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredItems.map(item => {
        const assetBelongsTo = getItemField(item, 'asset_belongs_to') || 'CtrlS';
        const typeOfInward = getItemField(item, 'inward_type') || getItemField(item, 'type_of_inward') || 'Inward Non Returnable';
        const invoiceDcNumber = getItemField(item, 'invoice_dc_number') || getItemField(item, 'dc_number') || 'N/A';
        const vendorName = getItemField(item, 'vendor_name') || 'N/A';
        const vehicleNumber = getItemField(item, 'vehicle_number') || 'N/A';
        const requesterName = getItemField(item, 'requester_name') || 'N/A';
        const invoiceValue = getItemField(item, 'invoice_value') || 0;
        const itemsQty = getItemField(item, 'items_qty') || getItemField(item, 'quantity') || 0;
        const materialDescription = getItemField(item, 'material_description') || 'N/A';
        const customerName = getItemField(item, 'customer_name');
        const gateName = getItemField(item, 'gate_name') || getItemField(item, 'gate_number') || 'N/A';
        const createdAt = item.created_at ? new Date(item.created_at).toLocaleString() : 'N/A';

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title-section">
                <div class="card-title">DC: ${invoiceDcNumber}</div>
                <div class="card-subtitle">${vendorName} • ${requesterName}</div>
              </div>
              <div class="card-badges">
                <span class="badge ${assetBadgeClass[assetBelongsTo] || 'badge-asset-ctrls'}">
                  <span>📋</span>
                  ${assetBelongsTo}
                </span>
                <span class="badge ${typeBadgeClass[typeOfInward] || 'badge-type-nonreturn'}">
                  <span>📦</span>
                  ${typeOfInward.replace('Inward ', '')}
                </span>
              </div>
            </div>
            <div class="card-details">
              ${customerName ? `
                <div class="detail">
                  <span class="detail-label">Customer</span>
                  <span class="detail-value">${customerName}</span>
                </div>
              ` : ''}
              <div class="detail">
                <span class="detail-label">Vehicle Number</span>
                <span class="detail-value">${vehicleNumber}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Invoice Value</span>
                <span class="detail-value">₹${parseFloat(invoiceValue).toLocaleString()}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Quantity</span>
                <span class="detail-value">${itemsQty} items</span>
              </div>
              <div class="detail">
                <span class="detail-label">Material</span>
                <span class="detail-value">${materialDescription}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Gate</span>
                <span class="detail-value">${gateName}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Entry Time</span>
                <span class="detail-value">${createdAt}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderError(error) {
      const container = document.getElementById('inwardList');
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Failed to load entries</h3>
          <p>${error.message || 'Please try again later'}</p>
        </div>
      `;
    }

    function filterItems(searchTerm) {
      if (!searchTerm || searchTerm.trim() === '') {
        filteredItems = [...inwardItems];
      } else {
        const term = searchTerm.toLowerCase().trim();
        filteredItems = inwardItems.filter(item => {
          const invoiceDcNumber = getItemField(item, 'invoice_dc_number') || getItemField(item, 'dc_number') || '';
          const vendorName = getItemField(item, 'vendor_name') || '';
          const vehicleNumber = getItemField(item, 'vehicle_number') || '';
          const requesterName = getItemField(item, 'requester_name') || '';
          const customerName = getItemField(item, 'customer_name') || '';
          const prPoNumber = getItemField(item, 'pr_po_number') || '';
          const entrySerialNumber = getItemField(item, 'entry_serial_number') || '';

          return (
            invoiceDcNumber.toLowerCase().includes(term) ||
            vendorName.toLowerCase().includes(term) ||
            vehicleNumber.toLowerCase().includes(term) ||
            requesterName.toLowerCase().includes(term) ||
            customerName.toLowerCase().includes(term) ||
            prPoNumber.toLowerCase().includes(term) ||
            entrySerialNumber.toLowerCase().includes(term)
          );
        });
      }
      renderInward();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterItems(e.target.value);
    });

    loadInward();
  </script>
</body>
</html>
