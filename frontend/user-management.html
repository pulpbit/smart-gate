<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Smart Gate Security</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    .section h2 {
      color: #1a1a1a;
      margin-bottom: 20px;
      font-size: 18px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #4a5568;
      font-weight: 500;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      padding: 10px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .delete-btn {
      background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
    }
    .edit-btn {
      background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #f7fafc;
      text-align: left;
      padding: 12px 16px;
      color: #4a5568;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      border-bottom: 2px solid #e2e8f0;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #1a1a1a;
      font-size: 14px;
    }
    tr:hover {
      background: #f7fafc;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    .actions button {
      padding: 6px 12px;
      font-size: 12px;
    }
    .role-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .role-admin {
      background: #e9d8fd;
      color: #6b46c1;
    }
    .role-gate {
      background: #bee3f8;
      color: #2b6cb0;
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h3 {
      color: #1a1a1a;
    }
    .close-btn {
      background: none;
      border: none;
      color: #718096;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      margin: 0;
      width: auto;
      background: none;
    }
    .close-btn:hover {
      color: #1a1a1a;
      transform: none;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>User Management</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="section">
      <h2>Add New User</h2>
      <div class="success" id="successMsg">User created successfully!</div>
      <div class="error" id="errorMsg"></div>
      <form id="addUserForm">
        <div class="form-row">
          <div class="form-group">
            <label for="newUsername">Username *</label>
            <input type="text" id="newUsername" placeholder="Enter username" required>
          </div>
          <div class="form-group">
            <label for="newPassword">Password *</label>
            <input type="password" id="newPassword" placeholder="Enter password" required>
          </div>
          <div class="form-group">
            <label for="newRole">Role *</label>
            <select id="newRole" required>
              <option value="">Select role</option>
              <option value="Admin">Admin</option>
              <option value="Gate">Gate</option>
            </select>
          </div>
          <div class="form-group" id="gateNumberGroup" style="display: none;">
            <label for="newGateNumber">Gate Number</label>
            <select id="newGateNumber">
              <option value="">Select gate</option>
              <option value="Gate 03">Gate 03</option>
              <option value="Gate 06">Gate 06</option>
              <option value="Gate 07">Gate 07</option>
              <option value="Gate 08">Gate 08</option>
              <option value="Gate 09">Gate 09</option>
            </select>
          </div>
        </div>
        <button type="submit">Add User</button>
      </form>
    </div>

    <div class="section">
      <h2>Existing Users</h2>
      <div id="usersTable">
        <div class="empty-state">Loading users...</div>
      </div>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit User</h3>
        <button class="close-btn" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="success" id="editSuccessMsg">User updated successfully!</div>
      <div class="error" id="editErrorMsg"></div>
      <form id="editUserForm">
        <input type="hidden" id="editUserId">
        <div class="form-group">
          <label for="editRole">Role</label>
          <select id="editRole">
            <option value="">Select role</option>
            <option value="Admin">Admin</option>
            <option value="Gate">Gate</option>
          </select>
        </div>
        <div class="form-group" id="editGateNumberGroup" style="display: none;">
          <label for="editGateNumber">Gate Number</label>
          <select id="editGateNumber">
            <option value="">Select gate</option>
            <option value="Gate 03">Gate 03</option>
            <option value="Gate 06">Gate 06</option>
            <option value="Gate 07">Gate 07</option>
            <option value="Gate 08">Gate 08</option>
            <option value="Gate 09">Gate 09</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editPassword">New Password (leave blank to keep current)</label>
          <input type="password" id="editPassword" placeholder="Enter new password">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px;">
          <button type="button" class="edit-btn" onclick="closeEditModal()" style="flex: 1;">Cancel</button>
          <button type="submit" style="flex: 1;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    if (!token || user.role !== 'Admin') {
      window.location.href = 'dashboard.html';
    }

    let users = [];

    document.getElementById('newRole').addEventListener('change', (e) => {
      const gateGroup = document.getElementById('gateNumberGroup');
      if (e.target.value === 'Gate') {
        gateGroup.style.display = 'block';
      } else {
        gateGroup.style.display = 'none';
      }
    });

    document.getElementById('editRole').addEventListener('change', (e) => {
      const gateGroup = document.getElementById('editGateNumberGroup');
      if (e.target.value === 'Gate') {
        gateGroup.style.display = 'block';
      } else {
        gateGroup.style.display = 'none';
      }
    });

    async function loadUsers() {
      try {
        users = await API.getUsers();
        renderUsers();
      } catch (error) {
        document.getElementById('usersTable').innerHTML = `
          <div class="empty-state">
            <p>Failed to load users: ${error.message}</p>
          </div>
        `;
      }
    }

    function renderUsers() {
      const container = document.getElementById('usersTable');
      
      if (users.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No users found</h3>
            <p>Add a user to see them here</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Role</th>
              <th>Gate Number</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>${u.username}</td>
                <td>
                  <span class="role-badge ${u.role === 'Admin' ? 'role-admin' : 'role-gate'}">
                    ${u.role}
                  </span>
                </td>
                <td>${u.gate_number || 'N/A'}</td>
                <td>${new Date(u.created_at).toLocaleDateString()}</td>
                <td>
                  <div class="actions">
                    <button class="edit-btn" onclick="openEditModal(${u.id})">Edit</button>
                    <button class="delete-btn" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        await API.createUser({
          username: document.getElementById('newUsername').value,
          password: document.getElementById('newPassword').value,
          role: document.getElementById('newRole').value,
          gateNumber: document.getElementById('newGateNumber').value || null
        });

        successMsg.style.display = 'block';
        e.target.reset();
        document.getElementById('gateNumberGroup').style.display = 'none';
        loadUsers();
        
        setTimeout(() => {
          successMsg.style.display = 'none';
        }, 3000);
      } catch (error) {
        errorMsg.textContent = error.message || 'Failed to create user';
        errorMsg.style.display = 'block';
      }
    });

    function openEditModal(userId) {
      const userToEdit = users.find(u => u.id === userId);
      if (!userToEdit) return;

      document.getElementById('editUserId').value = userToEdit.id;
      document.getElementById('editRole').value = userToEdit.role;
      document.getElementById('editGateNumber').value = userToEdit.gate_number || '';
      document.getElementById('editPassword').value = '';

      const gateGroup = document.getElementById('editGateNumberGroup');
      if (userToEdit.role === 'Gate') {
        gateGroup.style.display = 'block';
      } else {
        gateGroup.style.display = 'none';
      }

      document.getElementById('editSuccessMsg').style.display = 'none';
      document.getElementById('editErrorMsg').style.display = 'none';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    document.getElementById('editUserForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('editSuccessMsg');
      const errorMsg = document.getElementById('editErrorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      const userId = parseInt(document.getElementById('editUserId').value);
      const updates = {};

      if (document.getElementById('editRole').value) {
        updates.role = document.getElementById('editRole').value;
      }
      if (document.getElementById('editRole').value === 'Gate' && document.getElementById('editGateNumber').value) {
        updates.gateNumber = document.getElementById('editGateNumber').value;
      } else if (document.getElementById('editRole').value === 'Admin') {
        updates.gateNumber = null;
      }
      if (document.getElementById('editPassword').value) {
        updates.password = document.getElementById('editPassword').value;
      }

      try {
        await API.updateUser(userId, updates);
        successMsg.style.display = 'block';
        loadUsers();
        
        setTimeout(() => {
          closeEditModal();
        }, 1500);
      } catch (error) {
        errorMsg.textContent = error.message || 'Failed to update user';
        errorMsg.style.display = 'block';
      }
    });

    async function deleteUser(userId, username) {
      if (!confirm(`Are you sure you want to delete user "${username}"?`)) {
        return;
      }

      try {
        await API.deleteUser(userId);
        loadUsers();
      } catch (error) {
        alert('Failed to delete user: ' + error.message);
      }
    }

    loadUsers();
  </script>
</body>
</html>
