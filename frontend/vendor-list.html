<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor & Vehicle List - Smart Gate Security</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    .container {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (min-width: 768px) {
      .stats-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #667eea;
    }
    .stat-label {
      font-size: 14px;
      color: #718096;
    }
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }
    @media (min-width: 768px) {
      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .search-box .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #718096;
      font-size: 18px;
    }
    .toolbar-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .new-entry-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .new-entry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .new-entry-btn.secondary {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
    }
    .new-entry-btn.secondary:hover {
      box-shadow: 0 4px 12px rgba(72, 187, 120, 0.4);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tab {
      padding: 12px 24px;
      background: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #4a5568;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .tab:hover:not(.active) {
      background: #edf2f7;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    @media (min-width: 768px) {
      .card-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }
    }
    .card-title-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .card-subtitle {
      color: #718096;
      font-size: 14px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      gap: 4px;
    }
    .status.active {
      background: #c6f6d5;
      color: #276749;
    }
    .status.exited {
      background: #fed7d7;
      color: #c53030;
    }
    .card-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 768px) {
      .card-details {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .detail {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .detail-label {
      font-size: 12px;
      color: #718096;
    }
    .detail-value {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: 500;
    }
    .card-actions {
      display: flex;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      margin-top: 16px;
    }
    .exit-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .exit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(237, 137, 54, 0.4);
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      color: #1a1a1a;
      margin-bottom: 8px;
      font-size: 20px;
    }
    .empty-state p {
      color: #718096;
      margin-bottom: 24px;
    }
    .empty-state .new-entry-btn {
      display: inline-flex;
    }
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }
    .no-results .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vendor & Vehicle</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="stats-row">
      <div class="stat-card">
        <span class="stat-value" id="totalActive">0</span>
        <span class="stat-label">Active Inside</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="todayEntries">0</span>
        <span class="stat-label">Today's Entries</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalVendors">0</span>
        <span class="stat-label">Total Vendors</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalVehicles">0</span>
        <span class="stat-label">Total Vehicles</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name, mobile, vehicle...">
      </div>
      <div class="toolbar-buttons">
        <a href="vendor-entry.html" class="new-entry-btn">
          <span>➕</span>
          New Vendor Entry
        </a>
        <a href="vehicle-entry.html" class="new-entry-btn secondary">
          <span>➕</span>
          New Vehicle Entry
        </a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="vendorTab">
        <span>👤</span>
        Vendors
      </button>
      <button class="tab" id="vehicleTab">
        <span>🚗</span>
        Vehicles
      </button>
    </div>

    <div id="vendorSection">
      <div id="vendorList"></div>
    </div>

    <div id="vehicleSection" style="display: none;">
      <div id="vehicleList"></div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    const user = JSON.parse(localStorage.getItem('user') || '{}');

    let vendors = [];
    let vehicles = [];
    let filteredVendors = [];
    let filteredVehicles = [];
    let activeTab = 'vendor';

    async function loadVendors() {
      try {
        vendors = await API.getVendors();
        filteredVendors = [...vendors];
        updateStats();
        renderVendors();
      } catch (error) {
        console.error('Failed to load vendors:', error);
      }
    }

    async function loadVehicles() {
      try {
        vehicles = await API.getVehicles();
        filteredVehicles = [...vehicles];
        updateStats();
        renderVehicles();
      } catch (error) {
        console.error('Failed to load vehicles:', error);
      }
    }

    function updateStats() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      
      const activeVendors = vendors.filter(v => !v.exit_time).length;
      const activeVehicles = vehicles.filter(v => !v.exit_time).length;
      document.getElementById('totalActive').textContent = activeVendors + activeVehicles;
      
      const todayVendors = vendors.filter(v => new Date(v.created_at) >= todayStart).length;
      const todayVehicles = vehicles.filter(v => new Date(v.created_at) >= todayStart).length;
      document.getElementById('todayEntries').textContent = todayVendors + todayVehicles;
      
      document.getElementById('totalVendors').textContent = vendors.length;
      document.getElementById('totalVehicles').textContent = vehicles.length;
    }

    function renderVendors() {
      const container = document.getElementById('vendorList');
      
      if (vendors.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">👤</div>
            <h3>No vendor entries yet</h3>
            <p>Register your first vendor entry to get started</p>
            <a href="vendor-entry.html" class="new-entry-btn">
              <span>➕</span>
              New Vendor Entry
            </a>
          </div>
        `;
        return;
      }

      if (filteredVendors.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <div class="icon">🔍</div>
            <h3>No results found</h3>
            <p>Try a different search term</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredVendors.map(vendor => {
        const isExited = !!vendor.exit_time;
        const statusClass = isExited ? 'exited' : 'active';
        const statusText = isExited ? 'Exited' : 'Inside';

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title-section">
                <div class="card-title">${vendor.name}</div>
                <div class="card-subtitle">${vendor.company_name || 'No company'} • ${vendor.purpose || 'Visit'}</div>
              </div>
              <span class="status ${statusClass}">
                <span>${isExited ? '✅' : '🔴'}</span>
                ${statusText}
              </span>
            </div>
            <div class="card-details">
              <div class="detail">
                <span class="detail-label">Mobile</span>
                <span class="detail-value">${vendor.mobile}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Aadhaar</span>
                <span class="detail-value">${vendor.aadhaar_number || 'N/A'}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Entry Time</span>
                <span class="detail-value">${new Date(vendor.created_at).toLocaleString()}</span>
              </div>
              ${vendor.exit_time ? `
                <div class="detail">
                  <span class="detail-label">Exit Time</span>
                  <span class="detail-value">${new Date(vendor.exit_time).toLocaleString()}</span>
                </div>
              ` : ''}
              <div class="detail">
                <span class="detail-label">Gate</span>
                <span class="detail-value">${vendor.gate_number || 'N/A'}</span>
              </div>
            </div>
            ${!vendor.exit_time ? `
              <div class="card-actions">
                <button class="exit-btn" onclick="markVendorExit(${vendor.id})">Mark Exit</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function renderVehicles() {
      const container = document.getElementById('vehicleList');
      
      if (vehicles.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🚗</div>
            <h3>No vehicle entries yet</h3>
            <p>Register your first vehicle entry to get started</p>
            <a href="vehicle-entry.html" class="new-entry-btn secondary">
              <span>➕</span>
              New Vehicle Entry
            </a>
          </div>
        `;
        return;
      }

      if (filteredVehicles.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <div class="icon">🔍</div>
            <h3>No results found</h3>
            <p>Try a different search term</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filteredVehicles.map(vehicle => {
        const isExited = !!vehicle.exit_time;
        const statusClass = isExited ? 'exited' : 'active';
        const statusText = isExited ? 'Exited' : 'Inside';

        return `
          <div class="card">
            <div class="card-header">
              <div class="card-title-section">
                <div class="card-title">${vehicle.vehicle_number}</div>
                <div class="card-subtitle">${vehicle.vehicle_type || 'Vehicle'} • ${vehicle.company_name || 'No company'}</div>
              </div>
              <span class="status ${statusClass}">
                <span>${isExited ? '✅' : '🔴'}</span>
                ${statusText}
              </span>
            </div>
            <div class="card-details">
              <div class="detail">
                <span class="detail-label">Driver</span>
                <span class="detail-value">${vehicle.driver_name || 'N/A'}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Mobile</span>
                <span class="detail-value">${vehicle.driver_mobile || 'N/A'}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Purpose</span>
                <span class="detail-value">${vehicle.purpose || 'N/A'}</span>
              </div>
              <div class="detail">
                <span class="detail-label">Entry Time</span>
                <span class="detail-value">${new Date(vehicle.created_at).toLocaleString()}</span>
              </div>
              ${vehicle.exit_time ? `
                <div class="detail">
                  <span class="detail-label">Exit Time</span>
                  <span class="detail-value">${new Date(vehicle.exit_time).toLocaleString()}</span>
                </div>
              ` : ''}
              <div class="detail">
                <span class="detail-label">Gate</span>
                <span class="detail-value">${vehicle.gate_number || 'N/A'}</span>
              </div>
            </div>
            ${!vehicle.exit_time ? `
              <div class="card-actions">
                <button class="exit-btn" onclick="markVehicleExit(${vehicle.id})">Mark Exit</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    async function markVendorExit(id) {
      if (confirm('Mark this vendor as exited?')) {
        try {
          await API.vendorExit(id);
          await loadVendors();
        } catch (error) {
          alert('Failed to mark exit: ' + error.message);
        }
      }
    }

    async function markVehicleExit(id) {
      if (confirm('Mark this vehicle as exited?')) {
        try {
          await API.vehicleExit(id);
          await loadVehicles();
        } catch (error) {
          alert('Failed to mark exit: ' + error.message);
        }
      }
    }

    function filterItems(searchTerm) {
      const term = searchTerm ? searchTerm.toLowerCase().trim() : '';
      
      if (!term) {
        filteredVendors = [...vendors];
        filteredVehicles = [...vehicles];
      } else {
        filteredVendors = vendors.filter(v => {
          return (
            (v.name && v.name.toLowerCase().includes(term)) ||
            (v.mobile && v.mobile.toLowerCase().includes(term)) ||
            (v.company_name && v.company_name.toLowerCase().includes(term)) ||
            (v.purpose && v.purpose.toLowerCase().includes(term)) ||
            (v.aadhaar_number && v.aadhaar_number.toLowerCase().includes(term))
          );
        });
        
        filteredVehicles = vehicles.filter(v => {
          return (
            (v.vehicle_number && v.vehicle_number.toLowerCase().includes(term)) ||
            (v.driver_name && v.driver_name.toLowerCase().includes(term)) ||
            (v.driver_mobile && v.driver_mobile.toLowerCase().includes(term)) ||
            (v.company_name && v.company_name.toLowerCase().includes(term)) ||
            (v.purpose && v.purpose.toLowerCase().includes(term)) ||
            (v.vehicle_type && v.vehicle_type.toLowerCase().includes(term))
          );
        });
      }
      
      renderVendors();
      renderVehicles();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterItems(e.target.value);
    });

    document.getElementById('vendorTab').addEventListener('click', () => {
      activeTab = 'vendor';
      document.getElementById('vendorTab').classList.add('active');
      document.getElementById('vehicleTab').classList.remove('active');
      document.getElementById('vendorSection').style.display = 'block';
      document.getElementById('vehicleSection').style.display = 'none';
    });

    document.getElementById('vehicleTab').addEventListener('click', () => {
      activeTab = 'vehicle';
      document.getElementById('vehicleTab').classList.add('active');
      document.getElementById('vendorTab').classList.remove('active');
      document.getElementById('vehicleSection').style.display = 'block';
      document.getElementById('vendorSection').style.display = 'none';
    });

    loadVendors();
    loadVehicles();
  </script>
</body>
</html>
