<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Entry - Smart Gate Security</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .form-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-container h2 {
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .camera-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
    }
    #cameraVideo {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
    #capturedCanvas {
      display: none;
      width: 100%;
      border-radius: 8px;
    }
    .camera-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .camera-controls button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }
    .ocr-status {
      text-align: center;
      padding: 12px;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 8px;
      display: none;
    }
    .aadhaar-preview {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .aadhaar-preview img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
    }
    .section-title {
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vendor Entry</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="form-container">
      <h2>Register Vendor Entry</h2>
      <div class="success" id="successMsg">Entry created successfully!</div>
      <div class="error" id="errorMsg"></div>
      
      <form id="vendorForm">
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Enter vendor name" required>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label for="purpose">Purpose *</label>
          <select id="purpose" required>
            <option value="">Select purpose</option>
            <option value="Delivery">Delivery</option>
            <option value="Meeting">Meeting</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Interview">Interview</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="Enter company name">
        </div>

        <div class="form-group">
          <label for="aadhaarNumber">Aadhaar Number</label>
          <input type="text" id="aadhaarNumber" placeholder="XXXX XXXX XXXX" maxlength="14">
        </div>

        <div class="camera-section">
          <p class="section-title">Aadhaar Card Capture (Optional)</p>
          
          <div class="camera-controls">
            <button type="button" id="startFrontCamera">Front Side Camera</button>
            <button type="button" id="startBackCamera">Back Side Camera</button>
          </div>

          <div class="camera-container">
            <video id="cameraVideo" autoplay playsinline></video>
            <canvas id="capturedCanvas"></canvas>
          </div>

          <div class="camera-controls">
            <button type="button" id="captureBtn" style="display: none;">Capture</button>
            <button type="button" id="retakeBtn" style="display: none;">Retake</button>
            <button type="button" id="stopCameraBtn" style="display: none;">Stop Camera</button>
          </div>

          <div class="ocr-status" id="ocrStatus">Processing OCR...</div>

          <div class="aadhaar-preview" id="aadhaarPreview" style="display: none;">
            <div>
              <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568;">Front Side</p>
              <img id="frontPreview">
            </div>
            <div>
              <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568;">Back Side</p>
              <img id="backPreview">
            </div>
          </div>
        </div>

        <button type="submit" style="margin-top: 24px;">Submit Entry</button>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    let mediaStream = null;
    let currentCaptureType = null;
    let aadhaarFrontBase64 = null;
    let aadhaarBackBase64 = null;

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('capturedCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const ocrStatus = document.getElementById('ocrStatus');

    document.getElementById('aadhaarNumber').addEventListener('input', (e) => {
      let value = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
      if (value.length > 12) value = value.slice(0, 12);
      let formatted = '';
      for (let i = 0; i < value.length; i += 4) {
        formatted += value.slice(i, i + 4) + ' ';
      }
      e.target.value = formatted.trim();
    });

    async function startCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } 
        });
        video.srcObject = mediaStream;
        
        captureBtn.style.display = 'block';
        stopCameraBtn.style.display = 'block';
      } catch (error) {
        alert('Unable to access camera: ' + error.message);
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      canvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      stopCameraBtn.style.display = 'none';
    }

    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      
      video.style.display = 'none';
      canvas.style.display = 'block';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    function retake() {
      canvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
    }

    async function performOCR(imageData) {
      ocrStatus.style.display = 'block';
      ocrStatus.textContent = 'Processing OCR...';
      
      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(imageData);
        
        const text = ret.data.text;
        
        const aadhaarRegex = /\d{4}\s*\d{4}\s*\d{4}/;
        const aadhaarMatch = text.match(aadhaarRegex);
        
        if (aadhaarMatch && !document.getElementById('aadhaarNumber').value) {
          document.getElementById('aadhaarNumber').value = aadhaarMatch[0];
        }
        
        const nameRegex = /(?:Name|नाम)\s*:\s*([A-Za-z\s]+)/i;
        const nameMatch = text.match(nameRegex);
        
        if (nameMatch && !document.getElementById('name').value) {
          document.getElementById('name').value = nameMatch[1].trim();
        }
        
        await worker.terminate();
        ocrStatus.textContent = 'OCR Complete - Aadhaar number extracted';
        
        setTimeout(() => {
          ocrStatus.style.display = 'none';
        }, 3000);
        
      } catch (error) {
        console.error('OCR Error:', error);
        ocrStatus.textContent = 'OCR failed - you can enter details manually';
        setTimeout(() => {
          ocrStatus.style.display = 'none';
        }, 3000);
      }
    }

    document.getElementById('startFrontCamera').addEventListener('click', async () => {
      currentCaptureType = 'front';
      await startCamera();
    });

    document.getElementById('startBackCamera').addEventListener('click', async () => {
      currentCaptureType = 'back';
      await startCamera();
    });

    captureBtn.addEventListener('click', () => {
      const imageData = captureImage();
      const base64 = imageData.split(',')[1];
      
      if (currentCaptureType === 'front') {
        aadhaarFrontBase64 = base64;
        document.getElementById('frontPreview').src = imageData;
      } else {
        aadhaarBackBase64 = base64;
        document.getElementById('backPreview').src = imageData;
      }
      
      document.getElementById('aadhaarPreview').style.display = 'flex';
      performOCR(imageData);
    });

    retakeBtn.addEventListener('click', retake);
    stopCameraBtn.addEventListener('click', stopCamera);

    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        await API.createVendorEntry({
          name: document.getElementById('name').value,
          mobile: document.getElementById('mobile').value,
          purpose: document.getElementById('purpose').value,
          companyName: document.getElementById('companyName').value || null,
          aadhaarNumber: document.getElementById('aadhaarNumber').value.replace(/\s/g, '') || null,
          aadhaarFront: aadhaarFrontBase64,
          aadhaarBack: aadhaarBackBase64
        });

        successMsg.style.display = 'block';
        e.target.reset();
        aadhaarFrontBase64 = null;
        aadhaarBackBase64 = null;
        document.getElementById('aadhaarPreview').style.display = 'none';
        document.getElementById('frontPreview').src = '';
        document.getElementById('backPreview').src = '';
        stopCamera();
      } catch (error) {
        errorMsg.textContent = error.message || 'Failed to create entry';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
