<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Entry - Smart Gate Security</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .form-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-container h2 {
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .camera-section {
      margin-top: 24px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #capturedCanvas {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      justify-content: center;
    }
    .camera-controls button {
      width: auto;
      padding: 12px 32px;
      font-size: 16px;
    }
    .camera-controls .secondary-btn {
      background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
    }
    .ocr-status {
      text-align: center;
      padding: 12px;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 8px;
      display: none;
    }
    .aadhaar-preview {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      justify-content: center;
    }
    .aadhaar-preview img {
      width: 120px;
      height: 75px;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
    }
    .section-title {
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .scan-instructions {
      text-align: center;
      margin-bottom: 20px;
      color: #4a5568;
    }
    .scan-instructions h3 {
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    #vendorForm {
      display: none;
    }
    .debug-info {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vendor Entry</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="form-container">
      <div class="success" id="successMsg">Entry created successfully!</div>
      <div class="error" id="errorMsg"></div>
      
      <div id="cameraSection">
        <div class="scan-instructions">
          <h3>Scan Aadhaar Card</h3>
          <p>Position the front of the Aadhaar card within the frame and click Capture</p>
        </div>
        
        <div class="camera-controls">
          <button type="button" id="startCameraBtn">Start Camera</button>
        </div>

        <div class="camera-container">
          <video id="cameraVideo" autoplay playsinline></video>
          <canvas id="capturedCanvas"></canvas>
        </div>

        <div class="camera-controls" id="captureControls" style="display: none;">
          <button type="button" id="captureBtn">Capture</button>
          <button type="button" id="stopCameraBtn" class="secondary-btn">Stop</button>
        </div>

        <div class="camera-controls" id="retakeControls" style="display: none;">
          <button type="button" id="retakeBtn">Retake</button>
          <button type="button" id="stopCameraBtn2" class="secondary-btn">Stop</button>
        </div>

        <div class="ocr-status" id="ocrStatus">Processing OCR...</div>

        <div class="aadhaar-preview" id="aadhaarPreview" style="display: none;">
          <div>
            <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568; text-align: center;">Captured Image</p>
            <img id="capturedPreview">
          </div>
        </div>

        <div class="debug-info" id="debugInfo"></div>

        <div style="margin-top: 20px; text-align: center;">
          <button type="button" id="skipScanBtn" class="secondary-btn" style="width: auto; padding: 10px 24px;">Skip Scan & Enter Manually</button>
        </div>
      </div>
      
      <form id="vendorForm">
        <h2>Register Vendor Entry</h2>
        
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Enter vendor name" required>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="Enter company name">
        </div>

        <div class="form-group">
          <label for="aadhaarNumber">Aadhaar Number (Last 4 digits)</label>
          <input type="text" id="aadhaarNumber" placeholder="XXXX" maxlength="4">
        </div>

        <button type="submit" style="margin-top: 24px;">Submit Entry</button>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    let mediaStream = null;
    let aadhaarFrontBase64 = null;
    let fullAadhaarNumber = '';

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('capturedCanvas');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const stopCameraBtn2 = document.getElementById('stopCameraBtn2');
    const captureControls = document.getElementById('captureControls');
    const retakeControls = document.getElementById('retakeControls');
    const ocrStatus = document.getElementById('ocrStatus');
    const cameraSection = document.getElementById('cameraSection');
    const vendorForm = document.getElementById('vendorForm');
    const debugInfo = document.getElementById('debugInfo');

    const DEBUG_MODE = true;

    function logDebug(message) {
      console.log(message);
      if (DEBUG_MODE && debugInfo) {
        debugInfo.innerHTML += message + '\n';
      }
    }

    document.getElementById('aadhaarNumber').addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 4) value = value.slice(0, 4);
      e.target.value = value;
    });

    async function startCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        
        logDebug('=== Requesting camera access ===');
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          } 
        });
        
        logDebug('Camera access granted');
        video.srcObject = mediaStream;
        
        startCameraBtn.style.display = 'none';
        captureControls.style.display = 'flex';
        
      } catch (error) {
        logDebug('Camera error: ' + error.message);
        alert('Unable to access camera: ' + error.message);
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      canvas.style.display = 'none';
      video.style.display = 'block';
      startCameraBtn.style.display = 'block';
      captureControls.style.display = 'none';
      retakeControls.style.display = 'none';
    }

    function captureImage() {
      logDebug('=== Capturing image ===');
      
      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;
      
      logDebug('Video dimensions: ' + videoWidth + 'x' + videoHeight);
      
      canvas.width = videoWidth;
      canvas.height = videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      
      video.style.display = 'none';
      canvas.style.display = 'block';
      captureControls.style.display = 'none';
      retakeControls.style.display = 'flex';
      
      const imageData = canvas.toDataURL('image/jpeg', 0.9);
      logDebug('Image captured (base64 length: ' + imageData.length + ')');
      
      return imageData;
    }

    function retake() {
      canvas.style.display = 'none';
      video.style.display = 'block';
      retakeControls.style.display = 'none';
      captureControls.style.display = 'flex';
      document.getElementById('aadhaarPreview').style.display = 'none';
    }

    function showForm() {
      cameraSection.style.display = 'none';
      vendorForm.style.display = 'block';
    }

    function cleanExtractedName(rawName) {
      if (!rawName) return "";
      
      logDebug('--- Cleaning raw name: "' + rawName + '"');
      
      let cleaned = rawName.replace(/^[^A-Za-z]*/, '');
      cleaned = cleaned.replace(/^[a-zA-Z]\s+/, '');
      cleaned = cleaned.replace(/^[\W\d_]+/, '');
      cleaned = cleaned.replace(/\s+/g, ' ').trim();
      
      if (cleaned.length > 2 && /^[a-z]\s+[A-Z]/.test(cleaned)) {
        cleaned = cleaned.substring(2).trim();
      }
      
      if (cleaned.length > 0 && /^[a-z]/.test(cleaned)) {
        cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
      }
      
      const words = cleaned.split(/\s+/);
      if (words.length > 1 && words[0].length === 1 && /[a-zA-Z]/.test(words[0])) {
        words.shift();
        cleaned = words.join(' ');
      }
      
      if (cleaned.length < 3 || !cleaned.includes(' ')) {
        if (cleaned.length >= 2 && /^[A-Z][a-z]+$/.test(cleaned)) {
          return cleaned;
        }
        return "";
      }
      
      logDebug('--- Cleaned name: "' + cleaned + '"');
      return cleaned;
    }

    function advancedNameExtraction(rawText) {
      logDebug('');
      logDebug('=== Starting Name Extraction ===');
      
      let text = rawText.replace(/\n/g, ' ').replace(/\r/g, ' ');
      text = text.replace(/\s+/g, ' ').trim();
      
      logDebug('Text (single line): "' + text.substring(0, 200) + '..."');
      
      const explicitPatterns = [
        /(?:Name|Full Name|Applicant['']?s Name|Cardholder Name)[\s:]*([A-Z][a-zA-Z\s\.]{2,45}?)(?=\s+(?:Address|DOB|Year|Aadhaar|UID|\d{4}|\/|$))/i,
        /(?:S\/O|D\/O|W\/O)[:\s]*([A-Z][a-z]+\s+[A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i,
        /(?:^|\.\s)([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3})(?=\s+\d{4}|\s+[A-Z]{3,})/gm
      ];
      
      for (let i = 0; i < explicitPatterns.length; i++) {
        let match = text.match(explicitPatterns[i]);
        if (match && match[1]) {
          let candidate = match[1].trim();
          candidate = candidate.replace(/[^a-zA-Z\s]/g, '').replace(/\s+/g, ' ').trim();
          logDebug('Explicit pattern ' + (i+1) + ' match: "' + candidate + '"');
          if (candidate.length > 3 && candidate.length < 55) {
            const cleaned = cleanExtractedName(candidate);
            if (cleaned) {
              logDebug('=== Returning cleaned name from explicit pattern ===');
              return cleaned;
            }
          }
        }
      }
      
      const lines = rawText.split(/\r?\n/);
      logDebug('');
      logDebug('=== Checking lines (heuristic) ===');
      
      let bestName = "";
      let maxScore = 0;
      
      for (let i = 0; i < lines.length; i++) {
        let cleanLine = lines[i].trim();
        cleanLine = cleanLine.replace(/^[•\-*>_\s\d]+/, '');
        
        if (cleanLine.length < 4 || cleanLine.length > 60) continue;
        
        const words = cleanLine.split(/\s+/);
        if (words.length < 2) continue;
        
        const digitCount = (cleanLine.match(/\d/g) || []).length;
        if (digitCount > 3) continue;
        
        let capitalWords = 0;
        for (let w of words) {
          if (w.length > 1 && /^[A-Z][a-z]/.test(w)) capitalWords++;
        }
        
        let score = capitalWords * 3;
        
        if (!/aadhaar|uid|enrolment|address|care of|father|mother|dob/i.test(cleanLine)) {
          score += 4;
        }
        
        if (/^[A-Z][a-z]/.test(cleanLine)) {
          score += 5;
        }
        
        logDebug('Line ' + i + ' "' + cleanLine.substring(0, 40) + '..." score=' + score + ' capWords=' + capitalWords);
        
        if (score > maxScore && capitalWords >= 1) {
          maxScore = score;
          bestName = cleanLine.replace(/[^a-zA-Z\s]/g, '').trim();
        }
      }
      
      if (bestName) {
        logDebug('');
        logDebug('=== Best heuristic name: "' + bestName + '" ===');
        const cleaned = cleanExtractedName(bestName);
        if (cleaned) {
          logDebug('=== Returning cleaned heuristic name ===');
          return cleaned;
        }
      }
      
      logDebug('');
      logDebug('=== Trying fallback pattern (two capitalized words) ===');
      
      const fallbackMatch = text.match(/\b([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)\b/);
      if (fallbackMatch) {
        logDebug('Fallback match: "' + fallbackMatch[1] + '"');
        const cleaned = cleanExtractedName(fallbackMatch[1]);
        if (cleaned) {
          logDebug('=== Returning cleaned fallback name ===');
          return cleaned;
        }
      }
      
      logDebug('');
      logDebug('=== No name extracted ===');
      return "";
    }

    function extractLast4Digits(rawText) {
      logDebug('');
      logDebug('=== Extracting last 4 Aadhaar digits ===');
      
      let fullAadhaar = null;
      const groupPattern = /\b(\d{4})[\s\-]?(\d{4})[\s\-]?(\d{4})\b/g;
      let match;
      
      while ((match = groupPattern.exec(rawText)) !== null) {
        let candidate = match[1] + match[2] + match[3];
        if (/^\d{12}$/.test(candidate)) {
          fullAadhaar = candidate;
          logDebug('Found full Aadhaar (grouped): ' + fullAadhaar);
          break;
        }
      }
      
      if (!fullAadhaar) {
        const directMatch = rawText.match(/\b\d{12}\b/);
        if (directMatch) {
          fullAadhaar = directMatch[0];
          logDebug('Found full Aadhaar (direct): ' + fullAadhaar);
        }
      }
      
      if (fullAadhaar && fullAadhaar.length === 12) {
        const last4 = fullAadhaar.slice(-4);
        logDebug('=== Returning last 4 digits: ' + last4 + ' ===');
        fullAadhaarNumber = fullAadhaar;
        return last4;
      }
      
      const keywordPattern = /(?:Aadhaar|UID|Enrolment|Number)[\s:]*\.?\s*[\*\#]?(\d{4})/i;
      let kwMatch = rawText.match(keywordPattern);
      if (kwMatch && kwMatch[1]) {
        logDebug('Found 4 digits after keyword: ' + kwMatch[1]);
        return kwMatch[1];
      }
      
      const allFourDigits = rawText.match(/\b(\d{4})\b/g);
      if (allFourDigits) {
        for (let quad of allFourDigits) {
          let num = parseInt(quad, 10);
          if ((num < 1900 || num > 2030) && quad !== "0000") {
            logDebug('Found 4-digit group (not year): ' + quad);
            return quad;
          }
        }
        if (allFourDigits.length) {
          logDebug('Using first 4-digit group: ' + allFourDigits[0]);
          return allFourDigits[0];
        }
      }
      
      logDebug('=== No Aadhaar digits found ===');
      return "";
    }

    async function performOCR(imageData) {
      ocrStatus.style.display = 'block';
      ocrStatus.textContent = 'Processing OCR...';
      
      try {
        logDebug('');
        logDebug('=== OCR Started ===');
        
        logDebug('Initializing Tesseract worker...');
        const worker = await Tesseract.createWorker('eng', 1, {
          logger: m => console.log(m)
        });
        
        logDebug('Setting Tesseract parameters...');
        await worker.setParameters({
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 :./-',
          tessedit_pageseg_mode: '6',
          preserve_interword_spaces: '1'
        });
        
        logDebug('Running recognition...');
        const ret = await worker.recognize(imageData);
        logDebug('Recognition complete');
        
        const text = ret.data.text;
        logDebug('');
        logDebug('=== Full OCR Text ===');
        logDebug(text);
        logDebug('==================');
        
        const aadhaarLast4 = extractLast4Digits(text);
        
        if (aadhaarLast4) {
          logDebug('');
          logDebug('Aadhaar last 4 digits found: ' + aadhaarLast4);
          document.getElementById('aadhaarNumber').value = aadhaarLast4;
        } else {
          logDebug('');
          logDebug('No Aadhaar number found in OCR');
        }
        
        const extractedName = advancedNameExtraction(text);
        logDebug('');
        logDebug('=== Final Extracted Name: ' + (extractedName || 'null') + ' ===');
        
        if (extractedName && !document.getElementById('name').value) {
          document.getElementById('name').value = extractedName;
          logDebug('Name field populated with: "' + extractedName + '"');
        } else if (!extractedName) {
          logDebug('No name extracted, user will need to enter manually');
        }
        
        logDebug('Terminating Tesseract worker...');
        await worker.terminate();
        logDebug('Worker terminated');
        
        if (extractedName || aadhaarLast4) {
          ocrStatus.textContent = 'OCR Complete!';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 1500);
        } else {
          ocrStatus.textContent = 'OCR Complete. Please enter details manually.';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 2000);
        }
        
      } catch (error) {
        logDebug('');
        logDebug('*** OCR Error ***');
        logDebug('Message: ' + error.message);
        logDebug('Stack: ' + error.stack);
        console.error('OCR Error:', error);
        ocrStatus.textContent = 'OCR failed - you can enter details manually';
        setTimeout(() => {
          ocrStatus.style.display = 'none';
          showForm();
        }, 3000);
      }
    }

    startCameraBtn.addEventListener('click', async () => {
      await startCamera();
    });

    captureBtn.addEventListener('click', () => {
      const imageData = captureImage();
      const base64 = imageData.split(',')[1];
      
      aadhaarFrontBase64 = base64;
      document.getElementById('capturedPreview').src = imageData;
      document.getElementById('aadhaarPreview').style.display = 'flex';
      
      performOCR(imageData);
    });

    retakeBtn.addEventListener('click', retake);
    stopCameraBtn.addEventListener('click', stopCamera);
    stopCameraBtn2.addEventListener('click', stopCamera);

    document.getElementById('skipScanBtn').addEventListener('click', () => {
      stopCamera();
      showForm();
    });

    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        const aadhaarLastFour = document.getElementById('aadhaarNumber').value;
        let storedAadhaar = null;
        
        if (aadhaarLastFour && aadhaarLastFour.length === 4) {
          if (fullAadhaarNumber && fullAadhaarNumber.endsWith(aadhaarLastFour)) {
            storedAadhaar = fullAadhaarNumber;
          } else {
            storedAadhaar = 'XXXXXXXX' + aadhaarLastFour;
          }
        }

        logDebug('');
        logDebug('=== Submitting vendor entry ===');
        logDebug('Name: ' + document.getElementById('name').value);
        logDebug('Mobile: ' + document.getElementById('mobile').value);
        logDebug('Company: ' + document.getElementById('companyName').value);
        logDebug('Aadhaar: ' + storedAadhaar);

        await API.createVendorEntry({
          name: document.getElementById('name').value,
          mobile: document.getElementById('mobile').value,
          companyName: document.getElementById('companyName').value || null,
          aadhaarNumber: storedAadhaar,
          aadhaarFront: aadhaarFrontBase64,
          aadhaarBack: null
        });

        successMsg.style.display = 'block';
        e.target.reset();
        aadhaarFrontBase64 = null;
        fullAadhaarNumber = '';
        document.getElementById('aadhaarPreview').style.display = 'none';
        document.getElementById('capturedPreview').src = '';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);
      } catch (error) {
        logDebug('');
        logDebug('*** Submit Error ***');
        logDebug('Message: ' + error.message);
        errorMsg.textContent = error.message || 'Failed to create entry';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
