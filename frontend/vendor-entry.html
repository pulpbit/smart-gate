<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Entry - Smart Gate Security</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .form-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-container h2 {
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .camera-section {
      margin-top: 24px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
    }
    #cameraVideo {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
    #capturedCanvas {
      display: none;
      width: 100%;
      border-radius: 8px;
    }
    .camera-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .camera-controls button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }
    .camera-controls .secondary-btn {
      background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
    }
    .ocr-status {
      text-align: center;
      padding: 12px;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 8px;
      display: none;
    }
    .aadhaar-preview {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .aadhaar-preview img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
    }
    .section-title {
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .scan-instructions {
      text-align: center;
      margin-bottom: 20px;
      color: #4a5568;
    }
    .scan-instructions h3 {
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    #vendorForm {
      display: none;
    }
    .debug-info {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      font-family: monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vendor Entry</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="form-container">
      <div class="success" id="successMsg">Entry created successfully!</div>
      <div class="error" id="errorMsg"></div>
      
      <div id="cameraSection">
        <div class="scan-instructions">
          <h3>Scan Aadhaar Card</h3>
          <p>Position the front of the Aadhaar card within the camera frame and click Capture</p>
        </div>
        
        <div class="camera-controls">
          <button type="button" id="startFrontCamera">Front Side</button>
          <button type="button" id="startBackCamera">Back Side</button>
        </div>

        <div class="camera-container">
          <video id="cameraVideo" autoplay playsinline></video>
          <canvas id="capturedCanvas"></canvas>
        </div>

        <div class="camera-controls">
          <button type="button" id="captureBtn" style="display: none;">Capture</button>
          <button type="button" id="retakeBtn" style="display: none;">Retake</button>
          <button type="button" id="stopCameraBtn" class="secondary-btn" style="display: none;">Stop Camera</button>
        </div>

        <div class="ocr-status" id="ocrStatus">Processing OCR...</div>

        <div class="aadhaar-preview" id="aadhaarPreview" style="display: none;">
          <div>
            <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568;">Front Side</p>
            <img id="frontPreview">
          </div>
          <div>
            <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568;">Back Side</p>
            <img id="backPreview">
          </div>
        </div>

        <div class="debug-info" id="debugInfo"></div>

        <div style="margin-top: 20px; text-align: center;">
          <button type="button" id="skipScanBtn" class="secondary-btn" style="width: auto; padding: 10px 24px;">Skip Scan & Enter Manually</button>
        </div>
      </div>
      
      <form id="vendorForm">
        <h2>Register Vendor Entry</h2>
        
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Enter vendor name" required>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="Enter company name">
        </div>

        <div class="form-group">
          <label for="aadhaarNumber">Aadhaar Number (Last 4 digits)</label>
          <input type="text" id="aadhaarNumber" placeholder="XXXX" maxlength="4">
        </div>

        <button type="submit" style="margin-top: 24px;">Submit Entry</button>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    let mediaStream = null;
    let currentCaptureType = null;
    let aadhaarFrontBase64 = null;
    let aadhaarBackBase64 = null;
    let fullAadhaarNumber = '';

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('capturedCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const ocrStatus = document.getElementById('ocrStatus');
    const cameraSection = document.getElementById('cameraSection');
    const vendorForm = document.getElementById('vendorForm');
    const debugInfo = document.getElementById('debugInfo');

    const DEBUG_MODE = true;

    function logDebug(message) {
      console.log(message);
      if (DEBUG_MODE && debugInfo) {
        debugInfo.style.display = 'block';
        debugInfo.innerHTML += '<div>' + message + '</div>';
      }
    }

    document.getElementById('aadhaarNumber').addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 4) value = value.slice(0, 4);
      e.target.value = value;
    });

    async function startCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } 
        });
        video.srcObject = mediaStream;
        
        captureBtn.style.display = 'block';
        stopCameraBtn.style.display = 'block';
      } catch (error) {
        alert('Unable to access camera: ' + error.message);
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      canvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      stopCameraBtn.style.display = 'none';
    }

    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      
      video.style.display = 'none';
      canvas.style.display = 'block';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    function retake() {
      canvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
    }

    function showForm() {
      cameraSection.style.display = 'none';
      vendorForm.style.display = 'block';
    }

    function cleanLine(line) {
      return line.trim()
        .replace(/[^A-Za-z\u0900-\u097F\s\.\-\']/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isExcluded(line) {
      const lower = line.toLowerCase();
      const excludedWords = [
        'government', 'india', 'aadhaar', 'unique', 'identification', 'authority',
        'uidai', 'govt', 'of', 'the', 'to', 'address', 'dob', 'date', 'birth',
        'male', 'female', 'enrolment', 'enroll', 'vid', 'help', 'www', 'gov',
        'in', '1947', 'care', 'contact', 'toll', 'free', 'issue', 'download',
        'mobile', 'email', 'web', 'site', 'register', 'national', 'id', 'identity',
        'card', 'resident', 'citizen', 'portal', 'public', 'private', 'limited',
        'ltd', 'pvt', 'company', 'services', 'state', 'central', 'ministry',
        'department', 'office', 'division', 'verify', 'verification', 'kyc',
        'know', 'your', 'customer', 'client', 'resident', 'non-resident', 'nri',
        'oci', 'pio', 'foreigner', 'father', 'mother', 'parent', 'guardian',
        'spouse', 'wife', 'husband', 'son', 'daughter', 'child', 'relative',
        'relation', 'address', 'street', 'road', 'lane', 'gali', 'mohalla',
        'colony', 'sector', 'block', 'building', 'floor', 'flat', 'room', 'house',
        'plot', 'survey', 'village', 'town', 'city', 'district', 'tehsil', 'taluk',
        'state', 'country', 'pin', 'pincode', 'zip', 'code', 'postal', 'transgender',
        'third', 'gender', 'sex', 'भारत', 'सरकार', 'आधार', 'पुरुष', 'महिला',
        'जन्म', 'पता', 'महानिदेशालय', 'विभाग', 'कार्यालय', 'नाम', 'nama', 'nane', 'nam'
      ];
      
      const excludedExact = [
        'm', 'f', 'mr', 'mrs', 'ms', 'dr', 'prof', 'shri', 'smt', 'kum',
        's/o', 'd/o', 'w/o', 'h/o', 'c/o', 'son of', 'daughter of', 'wife of',
        'husband of', 'care of'
      ];

      if (excludedExact.includes(lower)) return true;
      
      for (const word of excludedWords) {
        if (lower.includes(word)) return true;
      }
      
      if (/^\d+$/.test(line)) return true;
      
      return false;
    }

    function isPossibleName(line) {
      if (!line || line.length < 3) return false;
      
      const cleaned = cleanLine(line);
      if (!cleaned || cleaned.length < 3) return false;
      
      if (isExcluded(cleaned)) return false;
      
      const words = cleaned.split(/\s+/).filter(w => w.length > 1);
      
      if (words.length < 2 || words.length > 4) return false;
      
      const hasDevanagari = /[\u0900-\u097F]/.test(cleaned);
      if (hasDevanagari) {
        return true;
      }
      
      const allCaps = /^[A-Z\s]+$/.test(cleaned);
      const titleCase = /^[A-Z][a-z]+(\s+[A-Z][a-z]+)+$/.test(cleaned);
      
      if (allCaps || titleCase) {
        return true;
      }
      
      return false;
    }

    function extractNameFromText(text) {
      logDebug('=== Starting Name Extraction ===');
      logDebug('Raw text length: ' + text.length);
      
      const lines = text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 2);
      
      logDebug('Number of lines: ' + lines.length);
      lines.forEach((line, i) => {
        logDebug('Line ' + i + ': "' + line + '"');
      });

      let nameKeywordIndex = -1;
      let dobIndex = -1;
      let genderIndex = -1;
      let uidaiIndex = -1;
      let govtIndex = -1;
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].toLowerCase();
        
        if (line.includes('name') || line.includes('नाम') || line.includes('nama') || line.includes('nane')) {
          if (nameKeywordIndex === -1) nameKeywordIndex = i;
        }
        
        if (line.includes('dob') || line.includes('birth') || line.includes('जन्म') || line.includes('date')) {
          if (dobIndex === -1) dobIndex = i;
        }
        
        if (line.includes('male') || line.includes('female') || line.includes('पुरुष') || line.includes('महिला')) {
          if (genderIndex === -1) genderIndex = i;
        }
        
        if (line.includes('uidai') || line.includes('unique')) {
          if (uidaiIndex === -1) uidaiIndex = i;
        }
        
        if (line.includes('government') || line.includes('भारत') || line.includes('सरकार')) {
          if (govtIndex === -1) govtIndex = i;
        }
      }

      logDebug('');
      logDebug('Key indices:');
      logDebug('  nameKeywordIndex: ' + nameKeywordIndex);
      logDebug('  dobIndex: ' + dobIndex);
      logDebug('  genderIndex: ' + genderIndex);
      logDebug('  uidaiIndex: ' + uidaiIndex);
      logDebug('  govtIndex: ' + govtIndex);

      if (nameKeywordIndex !== -1) {
        logDebug('');
        logDebug('=== Checking Name keyword at index ' + nameKeywordIndex + ' ===');
        
        const line = lines[nameKeywordIndex];
        logDebug('Line with keyword: "' + line + '"');
        
        const patterns = [
          /(?:name|नाम|nama|nane|nam)\s*[:\/\-\s]\s*([A-Za-z\u0900-\u097F\s\.]{3,})/i,
          /(?:name|नाम|nama|nane|nam)\s+([A-Za-z\u0900-\u097F\s\.]{3,})/i
        ];
        
        for (const pattern of patterns) {
          const match = line.match(pattern);
          if (match) {
            const candidate = cleanLine(match[1]);
            logDebug('Pattern match: "' + candidate + '"');
            if (!isExcluded(candidate) && candidate.length > 3) {
              logDebug('Found name after keyword: "' + candidate + '"');
              return candidate;
            }
          }
        }
        
        if (nameKeywordIndex + 1 < lines.length) {
          const nextLine = lines[nameKeywordIndex + 1];
          const candidate = cleanLine(nextLine);
          logDebug('Next line after keyword: "' + candidate + '"');
          
          if (!isExcluded(candidate) && candidate.length > 3) {
            const words = candidate.split(/\s+/).filter(w => w.length > 1);
            if (words.length >= 2 && words.length <= 4) {
              logDebug('Found name on next line: "' + candidate + '"');
              return candidate;
            }
          }
        }
      }

      logDebug('');
      logDebug('=== Searching between govt/uidai and dob/gender ===');
      
      const startSearch = Math.max(uidaiIndex, govtIndex, -1) + 1;
      const endSearch = Math.min(
        dobIndex !== -1 ? dobIndex : lines.length,
        genderIndex !== -1 ? genderIndex : lines.length
      );
      
      logDebug('Searching lines ' + startSearch + ' to ' + (endSearch - 1));

      for (let i = startSearch; i < endSearch && i < lines.length; i++) {
        const line = lines[i];
        logDebug('Checking line ' + i + ': "' + line + '"');
        
        if (isPossibleName(line)) {
          const candidate = cleanLine(line);
          logDebug('Possible name found: "' + candidate + '"');
          return candidate;
        }
      }

      logDebug('');
      logDebug('=== Fallback: searching all lines ===');
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        
        if (isPossibleName(line)) {
          const candidate = cleanLine(line);
          logDebug('Fallback name found: "' + candidate + '"');
          return candidate;
        }
      }

      logDebug('No name found in OCR text');
      return null;
    }

    async function performOCR(imageData) {
      ocrStatus.style.display = 'block';
      ocrStatus.textContent = 'Processing OCR...';
      
      if (debugInfo) {
        debugInfo.innerHTML = '';
      }
      
      try {
        logDebug('=== OCR Started ===');
        
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(imageData);
        
        const text = ret.data.text;
        logDebug('');
        logDebug('=== Full OCR Text ===');
        logDebug(text);
        logDebug('');
        
        const aadhaarRegex = /\d{4}\s*\d{4}\s*\d{4}/;
        const aadhaarMatch = text.match(aadhaarRegex);
        
        if (aadhaarMatch) {
          logDebug('Aadhaar number found: ' + aadhaarMatch[0]);
          fullAadhaarNumber = aadhaarMatch[0].replace(/\s/g, '');
          const lastFour = fullAadhaarNumber.slice(-4);
          document.getElementById('aadhaarNumber').value = lastFour;
          logDebug('Last 4 digits: ' + lastFour);
        } else {
          logDebug('No Aadhaar number found');
        }
        
        const extractedName = extractNameFromText(text);
        logDebug('');
        logDebug('=== Final Extracted Name: ' + (extractedName || 'null') + ' ===');
        
        if (extractedName && !document.getElementById('name').value) {
          document.getElementById('name').value = extractedName;
        }
        
        await worker.terminate();
        
        if (extractedName || aadhaarMatch) {
          ocrStatus.textContent = 'OCR Complete!';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 1500);
        } else {
          ocrStatus.textContent = 'OCR Complete. Please enter details manually.';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 2000);
        }
        
      } catch (error) {
        logDebug('OCR Error: ' + error.message);
        logDebug('Stack: ' + error.stack);
        console.error('OCR Error:', error);
        ocrStatus.textContent = 'OCR failed - you can enter details manually';
        setTimeout(() => {
          ocrStatus.style.display = 'none';
          showForm();
        }, 3000);
      }
    }

    document.getElementById('startFrontCamera').addEventListener('click', async () => {
      currentCaptureType = 'front';
      await startCamera();
    });

    document.getElementById('startBackCamera').addEventListener('click', async () => {
      currentCaptureType = 'back';
      await startCamera();
    });

    captureBtn.addEventListener('click', () => {
      const imageData = captureImage();
      const base64 = imageData.split(',')[1];
      
      if (currentCaptureType === 'front') {
        aadhaarFrontBase64 = base64;
        document.getElementById('frontPreview').src = imageData;
      } else {
        aadhaarBackBase64 = base64;
        document.getElementById('backPreview').src = imageData;
      }
      
      document.getElementById('aadhaarPreview').style.display = 'flex';
      
      if (currentCaptureType === 'front') {
        performOCR(imageData);
      }
    });

    retakeBtn.addEventListener('click', retake);
    stopCameraBtn.addEventListener('click', stopCamera);

    document.getElementById('skipScanBtn').addEventListener('click', () => {
      stopCamera();
      showForm();
    });

    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        const aadhaarLastFour = document.getElementById('aadhaarNumber').value;
        let storedAadhaar = null;
        
        if (aadhaarLastFour && aadhaarLastFour.length === 4) {
          if (fullAadhaarNumber && fullAadhaarNumber.endsWith(aadhaarLastFour)) {
            storedAadhaar = fullAadhaarNumber;
          } else {
            storedAadhaar = 'XXXXXXXX' + aadhaarLastFour;
          }
        }

        logDebug('=== Submitting vendor entry ===');
        logDebug('Name: ' + document.getElementById('name').value);
        logDebug('Mobile: ' + document.getElementById('mobile').value);
        logDebug('Company: ' + document.getElementById('companyName').value);
        logDebug('Aadhaar: ' + storedAadhaar);

        await API.createVendorEntry({
          name: document.getElementById('name').value,
          mobile: document.getElementById('mobile').value,
          companyName: document.getElementById('companyName').value || null,
          aadhaarNumber: storedAadhaar,
          aadhaarFront: aadhaarFrontBase64,
          aadhaarBack: aadhaarBackBase64
        });

        successMsg.style.display = 'block';
        e.target.reset();
        aadhaarFrontBase64 = null;
        aadhaarBackBase64 = null;
        fullAadhaarNumber = '';
        document.getElementById('aadhaarPreview').style.display = 'none';
        document.getElementById('frontPreview').src = '';
        document.getElementById('backPreview').src = '';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);
      } catch (error) {
        logDebug('Submit Error: ' + error.message);
        errorMsg.textContent = error.message || 'Failed to create entry';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
