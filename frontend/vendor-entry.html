<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Entry - Smart Gate Security</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .form-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-container h2 {
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .camera-section {
      margin-top: 24px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
    }
    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #capturedCanvas {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      justify-content: center;
    }
    .camera-controls button {
      width: auto;
      padding: 12px 32px;
      font-size: 16px;
    }
    .camera-controls .secondary-btn {
      background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
    }
    .ocr-status {
      text-align: center;
      padding: 12px;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 8px;
      display: none;
    }
    .aadhaar-preview {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      justify-content: center;
    }
    .aadhaar-preview img {
      width: 120px;
      height: 75px;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
    }
    .section-title {
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .scan-instructions {
      text-align: center;
      margin-bottom: 20px;
      color: #4a5568;
    }
    .scan-instructions h3 {
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    #vendorForm {
      display: none;
    }
    .debug-info {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      font-family: monospace;
      font-size: 12px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vendor Entry</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="form-container">
      <div class="success" id="successMsg">Entry created successfully!</div>
      <div class="error" id="errorMsg"></div>
      
      <div id="cameraSection">
        <div class="scan-instructions">
          <h3>Scan Aadhaar Card</h3>
          <p>Position the front of the Aadhaar card within the frame and click Capture</p>
        </div>
        
        <div class="camera-controls">
          <button type="button" id="startCameraBtn">Start Camera</button>
        </div>

        <div class="camera-container">
          <video id="cameraVideo" autoplay playsinline></video>
          <canvas id="capturedCanvas"></canvas>
        </div>

        <div class="camera-controls" id="captureControls" style="display: none;">
          <button type="button" id="captureBtn">Capture</button>
          <button type="button" id="stopCameraBtn" class="secondary-btn">Stop</button>
        </div>

        <div class="camera-controls" id="retakeControls" style="display: none;">
          <button type="button" id="retakeBtn">Retake</button>
          <button type="button" id="stopCameraBtn2" class="secondary-btn">Stop</button>
        </div>

        <div class="ocr-status" id="ocrStatus">Processing OCR...</div>

        <div class="aadhaar-preview" id="aadhaarPreview" style="display: none;">
          <div>
            <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568; text-align: center;">Captured Image</p>
            <img id="capturedPreview">
          </div>
        </div>

        <div class="debug-info" id="debugInfo"></div>

        <div style="margin-top: 20px; text-align: center;">
          <button type="button" id="skipScanBtn" class="secondary-btn" style="width: auto; padding: 10px 24px;">Skip Scan & Enter Manually</button>
        </div>
      </div>
      
      <form id="vendorForm">
        <h2>Register Vendor Entry</h2>
        
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Enter vendor name" required>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="Enter company name">
        </div>

        <div class="form-group">
          <label for="aadhaarNumber">Aadhaar Number (Last 4 digits)</label>
          <input type="text" id="aadhaarNumber" placeholder="XXXX" maxlength="4">
        </div>

        <button type="submit" style="margin-top: 24px;">Submit Entry</button>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    let mediaStream = null;
    let aadhaarFrontBase64 = null;
    let fullAadhaarNumber = '';

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('capturedCanvas');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const stopCameraBtn2 = document.getElementById('stopCameraBtn2');
    const captureControls = document.getElementById('captureControls');
    const retakeControls = document.getElementById('retakeControls');
    const ocrStatus = document.getElementById('ocrStatus');
    const cameraSection = document.getElementById('cameraSection');
    const vendorForm = document.getElementById('vendorForm');
    const debugInfo = document.getElementById('debugInfo');

    const DEBUG_MODE = true;

    function logDebug(message) {
      console.log(message);
      if (DEBUG_MODE && debugInfo) {
        debugInfo.innerHTML += message + '\n';
      }
    }

    document.getElementById('aadhaarNumber').addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 4) value = value.slice(0, 4);
      e.target.value = value;
    });

    async function startCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        
        logDebug('=== Requesting camera access ===');
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          } 
        });
        
        logDebug('Camera access granted');
        video.srcObject = mediaStream;
        
        startCameraBtn.style.display = 'none';
        captureControls.style.display = 'flex';
        
      } catch (error) {
        logDebug('Camera error: ' + error.message);
        alert('Unable to access camera: ' + error.message);
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      canvas.style.display = 'none';
      video.style.display = 'block';
      startCameraBtn.style.display = 'block';
      captureControls.style.display = 'none';
      retakeControls.style.display = 'none';
    }

    function captureImage() {
      logDebug('=== Capturing image ===');
      
      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;
      
      logDebug('Video dimensions: ' + videoWidth + 'x' + videoHeight);
      
      canvas.width = videoWidth;
      canvas.height = videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      
      video.style.display = 'none';
      canvas.style.display = 'block';
      captureControls.style.display = 'none';
      retakeControls.style.display = 'flex';
      
      const imageData = canvas.toDataURL('image/jpeg', 0.9);
      logDebug('Image captured (base64 length: ' + imageData.length + ')');
      
      return imageData;
    }

    function retake() {
      canvas.style.display = 'none';
      video.style.display = 'block';
      retakeControls.style.display = 'none';
      captureControls.style.display = 'flex';
      document.getElementById('aadhaarPreview').style.display = 'none';
    }

    function showForm() {
      cameraSection.style.display = 'none';
      vendorForm.style.display = 'block';
    }

    function cleanLine(line) {
      return line.trim()
        .replace(/[^A-Za-z\u0900-\u097F\s\.\-\']/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    const excludedWords = [
      'government', 'india', 'aadhaar', 'aadhar', 'adhaar', 'adhar',
      'unique', 'identification', 'authority', 'uidai', 'govt',
      'of', 'the', 'to', 'and', 'or', 'by', 'for', 'in', 'on', 'at',
      'address', 'dob', 'date', 'birth', 'male', 'female', 'transgender',
      'enrolment', 'enroll', 'vid', 'help', 'www', 'gov', '1947',
      'care', 'contact', 'toll', 'free', 'issue', 'download', 'mobile',
      'email', 'web', 'site', 'register', 'national', 'id', 'identity',
      'card', 'resident', 'citizen', 'portal', 'public', 'private', 'limited',
      'ltd', 'pvt', 'company', 'services', 'state', 'central', 'ministry',
      'department', 'office', 'division', 'verify', 'verification', 'kyc',
      'know', 'your', 'customer', 'client', 'non-resident', 'nri',
      'oci', 'pio', 'foreigner', 'father', 'mother', 'parent', 'guardian',
      'spouse', 'wife', 'husband', 'son', 'daughter', 'child', 'relative',
      'relation', 'street', 'road', 'lane', 'gali', 'mohalla',
      'colony', 'sector', 'block', 'building', 'floor', 'flat', 'room', 'house',
      'plot', 'survey', 'village', 'town', 'city', 'district', 'tehsil', 'taluk',
      'country', 'pin', 'pincode', 'zip', 'code', 'postal', 'gender', 'sex',
      'भारत', 'सरकार', 'आधार', 'पुरुष', 'महिला', 'जन्म', 'पता',
      'महानिदेशालय', 'विभाग', 'कार्यालय', 'नाम', 'nama', 'nane', 'nam',
      'माता', 'पिता', 'पत्नी', 'पति', 'पुत्र', 'पुत्री',
      's/o', 'd/o', 'w/o', 'h/o', 'c/o', 'son of', 'daughter of', 'wife of',
      'husband of', 'care of', 'mr', 'mrs', 'ms', 'dr', 'prof', 'shri', 'smt', 'kum',
      'm/', 'f/', 'm:', 'f:', 'mr.', 'mrs.', 'ms.', 'dr.'
    ];

    function isExcluded(word) {
      const lower = word.toLowerCase();
      return excludedWords.includes(lower);
    }

    function hasExcludedWord(line) {
      const lower = line.toLowerCase();
      for (const word of excludedWords) {
        if (lower.includes(word)) return true;
      }
      return false;
    }

    function isDigitsOnly(line) {
      return /^[\d\s]+$/.test(line);
    }

    function isPossibleName(line) {
      if (!line || line.length < 3) return false;
      
      const cleaned = cleanLine(line);
      if (!cleaned || cleaned.length < 3) return false;
      
      if (hasExcludedWord(cleaned)) return false;
      if (isDigitsOnly(cleaned)) return false;
      
      const words = cleaned.split(/\s+/).filter(w => w.length > 1);
      
      if (words.length < 2 || words.length > 4) return false;
      
      for (const word of words) {
        if (isExcluded(word)) return false;
      }
      
      const hasDevanagari = /[\u0900-\u097F]/.test(cleaned);
      if (hasDevanagari) {
        return true;
      }
      
      const allCaps = /^[A-Z\s\.]+$/.test(cleaned);
      const titleCase = /^[A-Z][a-z]+(\s+[A-Z][a-z]+)+$/.test(cleaned);
      const mixedCase = /^[A-Za-z\s\.]+$/.test(cleaned);
      
      if (allCaps || titleCase) {
        return true;
      }
      
      if (mixedCase && words.length >= 2) {
        return true;
      }
      
      return false;
    }

    function extractNameFromText(text) {
      logDebug('');
      logDebug('=== Starting Name Extraction ===');
      logDebug('Raw text length: ' + text.length);
      
      const lines = text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 2);
      
      logDebug('');
      logDebug('Number of lines: ' + lines.length);
      lines.forEach((line, i) => {
        logDebug('Line ' + i + ': "' + line + '"');
      });

      let nameKeywordIndex = -1;
      let dobIndex = -1;
      let genderIndex = -1;
      let uidaiIndex = -1;
      let govtIndex = -1;
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].toLowerCase();
        
        if (line.includes('name') || line.includes('नाम') || line.includes('nama') || line.includes('nane')) {
          if (nameKeywordIndex === -1) nameKeywordIndex = i;
        }
        
        if (line.includes('dob') || line.includes('birth') || line.includes('जन्म') || 
            (line.includes('date') && line.includes('/'))) {
          if (dobIndex === -1) dobIndex = i;
        }
        
        if (line.includes('male') || line.includes('female') || line.includes('पुरुष') || 
            line.includes('महिला') || line.includes('transgender')) {
          if (genderIndex === -1) genderIndex = i;
        }
        
        if (line.includes('uidai') || line.includes('unique') || line.includes('identification')) {
          if (uidaiIndex === -1) uidaiIndex = i;
        }
        
        if (line.includes('government') || line.includes('भारत') || line.includes('सरकार') ||
            line.includes('govt') || line.includes('india')) {
          if (govtIndex === -1) govtIndex = i;
        }
      }

      logDebug('');
      logDebug('Key indices:');
      logDebug('  nameKeywordIndex: ' + nameKeywordIndex);
      logDebug('  dobIndex: ' + dobIndex);
      logDebug('  genderIndex: ' + genderIndex);
      logDebug('  uidaiIndex: ' + uidaiIndex);
      logDebug('  govtIndex: ' + govtIndex);

      if (nameKeywordIndex !== -1) {
        logDebug('');
        logDebug('=== Checking Name keyword at index ' + nameKeywordIndex + ' ===');
        
        const line = lines[nameKeywordIndex];
        logDebug('Line with keyword: "' + line + '"');
        
        const patterns = [
          /(?:name|नाम|nama|nane|nam)\s*[:\/\-\s]\s*([A-Za-z\u0900-\u097F\s\.]{3,})/i,
          /(?:name|नाम|nama|nane|nam)\s+([A-Za-z\u0900-\u097F\s\.]{3,})/i
        ];
        
        for (const pattern of patterns) {
          const match = line.match(pattern);
          if (match) {
            const candidate = cleanLine(match[1]);
            logDebug('Pattern match: "' + candidate + '"');
            if (!hasExcludedWord(candidate) && candidate.length > 3) {
              logDebug('** FOUND NAME after keyword: "' + candidate + '" **');
              return candidate;
            }
          }
        }
        
        if (nameKeywordIndex + 1 < lines.length) {
          const nextLine = lines[nameKeywordIndex + 1];
          const candidate = cleanLine(nextLine);
          logDebug('Next line after keyword: "' + candidate + '"');
          
          if (!hasExcludedWord(candidate) && candidate.length > 3) {
            const words = candidate.split(/\s+/).filter(w => w.length > 1);
            if (words.length >= 2 && words.length <= 4) {
              logDebug('** FOUND NAME on next line: "' + candidate + '" **');
              return candidate;
            }
          }
        }
      }

      logDebug('');
      logDebug('=== Searching between govt/uidai and dob/gender ===');
      
      const startSearch = Math.max(uidaiIndex, govtIndex, -1) + 1;
      const endSearch = Math.min(
        dobIndex !== -1 ? dobIndex : lines.length,
        genderIndex !== -1 ? genderIndex : lines.length
      );
      
      logDebug('Searching lines ' + startSearch + ' to ' + (endSearch - 1));

      for (let i = startSearch; i < endSearch && i < lines.length; i++) {
        const line = lines[i];
        logDebug('Checking line ' + i + ': "' + line + '"');
        
        if (isPossibleName(line)) {
          const candidate = cleanLine(line);
          logDebug('** FOUND NAME in search range: "' + candidate + '" **');
          return candidate;
        }
      }

      logDebug('');
      logDebug('=== Looking for lines with 2-4 words (no digits) ===');
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        
        if (isPossibleName(line)) {
          const candidate = cleanLine(line);
          logDebug('** FOUND NAME in fallback: "' + candidate + '" **');
          return candidate;
        }
      }

      logDebug('');
      logDebug('No name found in OCR text');
      return null;
    }

    async function performOCR(imageData) {
      ocrStatus.style.display = 'block';
      ocrStatus.textContent = 'Processing OCR...';
      
      try {
        logDebug('');
        logDebug('=== OCR Started ===');
        
        logDebug('Initializing Tesseract worker...');
        const worker = await Tesseract.createWorker('eng');
        logDebug('Worker initialized');
        
        logDebug('Running recognition...');
        const ret = await worker.recognize(imageData);
        logDebug('Recognition complete');
        
        const text = ret.data.text;
        logDebug('');
        logDebug('=== Full OCR Text ===');
        logDebug(text);
        logDebug('==================');
        
        const aadhaarRegex = /\d{4}\s*\d{4}\s*\d{4}/;
        const aadhaarMatch = text.match(aadhaarRegex);
        
        if (aadhaarMatch) {
          logDebug('');
          logDebug('Aadhaar number found: ' + aadhaarMatch[0]);
          fullAadhaarNumber = aadhaarMatch[0].replace(/\s/g, '');
          const lastFour = fullAadhaarNumber.slice(-4);
          document.getElementById('aadhaarNumber').value = lastFour;
          logDebug('Last 4 digits: ' + lastFour);
        } else {
          logDebug('');
          logDebug('No Aadhaar number found in OCR');
        }
        
        const extractedName = extractNameFromText(text);
        logDebug('');
        logDebug('=== Final Extracted Name: ' + (extractedName || 'null') + ' ===');
        
        if (extractedName && !document.getElementById('name').value) {
          document.getElementById('name').value = extractedName;
          logDebug('Name field populated with: "' + extractedName + '"');
        } else if (!extractedName) {
          logDebug('No name extracted, user will need to enter manually');
        }
        
        logDebug('Terminating Tesseract worker...');
        await worker.terminate();
        logDebug('Worker terminated');
        
        if (extractedName || aadhaarMatch) {
          ocrStatus.textContent = 'OCR Complete!';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 1500);
        } else {
          ocrStatus.textContent = 'OCR Complete. Please enter details manually.';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 2000);
        }
        
      } catch (error) {
        logDebug('');
        logDebug('*** OCR Error ***');
        logDebug('Message: ' + error.message);
        logDebug('Stack: ' + error.stack);
        console.error('OCR Error:', error);
        ocrStatus.textContent = 'OCR failed - you can enter details manually';
        setTimeout(() => {
          ocrStatus.style.display = 'none';
          showForm();
        }, 3000);
      }
    }

    startCameraBtn.addEventListener('click', async () => {
      await startCamera();
    });

    captureBtn.addEventListener('click', () => {
      const imageData = captureImage();
      const base64 = imageData.split(',')[1];
      
      aadhaarFrontBase64 = base64;
      document.getElementById('capturedPreview').src = imageData;
      document.getElementById('aadhaarPreview').style.display = 'flex';
      
      performOCR(imageData);
    });

    retakeBtn.addEventListener('click', retake);
    stopCameraBtn.addEventListener('click', stopCamera);
    stopCameraBtn2.addEventListener('click', stopCamera);

    document.getElementById('skipScanBtn').addEventListener('click', () => {
      stopCamera();
      showForm();
    });

    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        const aadhaarLastFour = document.getElementById('aadhaarNumber').value;
        let storedAadhaar = null;
        
        if (aadhaarLastFour && aadhaarLastFour.length === 4) {
          if (fullAadhaarNumber && fullAadhaarNumber.endsWith(aadhaarLastFour)) {
            storedAadhaar = fullAadhaarNumber;
          } else {
            storedAadhaar = 'XXXXXXXX' + aadhaarLastFour;
          }
        }

        logDebug('');
        logDebug('=== Submitting vendor entry ===');
        logDebug('Name: ' + document.getElementById('name').value);
        logDebug('Mobile: ' + document.getElementById('mobile').value);
        logDebug('Company: ' + document.getElementById('companyName').value);
        logDebug('Aadhaar: ' + storedAadhaar);

        await API.createVendorEntry({
          name: document.getElementById('name').value,
          mobile: document.getElementById('mobile').value,
          companyName: document.getElementById('companyName').value || null,
          aadhaarNumber: storedAadhaar,
          aadhaarFront: aadhaarFrontBase64,
          aadhaarBack: null
        });

        successMsg.style.display = 'block';
        e.target.reset();
        aadhaarFrontBase64 = null;
        fullAadhaarNumber = '';
        document.getElementById('aadhaarPreview').style.display = 'none';
        document.getElementById('capturedPreview').src = '';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);
      } catch (error) {
        logDebug('');
        logDebug('*** Submit Error ***');
        logDebug('Message: ' + error.message);
        errorMsg.textContent = error.message || 'Failed to create entry';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
