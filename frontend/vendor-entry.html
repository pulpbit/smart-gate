<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Entry - Smart Gate Security</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f7fafc;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }
    .back-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .form-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .form-container h2 {
      color: #1a1a1a;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .success {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .camera-section {
      margin-top: 24px;
    }
    .camera-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
    }
    #cameraVideo {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
    #capturedCanvas {
      display: none;
      width: 100%;
      border-radius: 8px;
    }
    .camera-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .camera-controls button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
    }
    .camera-controls .secondary-btn {
      background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
    }
    .ocr-status {
      text-align: center;
      padding: 12px;
      background: #ebf8ff;
      color: #2b6cb0;
      border-radius: 8px;
      display: none;
    }
    .aadhaar-preview {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .aadhaar-preview img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border: 2px solid #e2e8f0;
      border-radius: 4px;
    }
    .section-title {
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .scan-instructions {
      text-align: center;
      margin-bottom: 20px;
      color: #4a5568;
    }
    .scan-instructions h3 {
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    #vendorForm {
      display: none;
    }
    .form-divider {
      border-top: 1px solid #e2e8f0;
      margin: 24px 0;
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Vendor Entry</h1>
    <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="container">
    <div class="form-container">
      <div class="success" id="successMsg">Entry created successfully!</div>
      <div class="error" id="errorMsg"></div>
      
      <div id="cameraSection">
        <div class="scan-instructions">
          <h3>Scan Aadhaar Card</h3>
          <p>Position the front of the Aadhaar card within the camera frame and click Capture</p>
        </div>
        
        <div class="camera-controls">
          <button type="button" id="startFrontCamera">Front Side</button>
          <button type="button" id="startBackCamera">Back Side</button>
        </div>

        <div class="camera-container">
          <video id="cameraVideo" autoplay playsinline></video>
          <canvas id="capturedCanvas"></canvas>
        </div>

        <div class="camera-controls">
          <button type="button" id="captureBtn" style="display: none;">Capture</button>
          <button type="button" id="retakeBtn" style="display: none;">Retake</button>
          <button type="button" id="stopCameraBtn" class="secondary-btn" style="display: none;">Stop Camera</button>
        </div>

        <div class="ocr-status" id="ocrStatus">Processing OCR...</div>

        <div class="aadhaar-preview" id="aadhaarPreview" style="display: none;">
          <div>
            <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568;">Front Side</p>
            <img id="frontPreview">
          </div>
          <div>
            <p style="font-size: 12px; margin-bottom: 4px; color: #4a5568;">Back Side</p>
            <img id="backPreview">
          </div>
        </div>

        <div style="margin-top: 20px; text-align: center;">
          <button type="button" id="skipScanBtn" class="secondary-btn" style="width: auto; padding: 10px 24px;">Skip Scan & Enter Manually</button>
        </div>
      </div>
      
      <form id="vendorForm">
        <h2>Register Vendor Entry</h2>
        
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" placeholder="Enter vendor name" required>
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number *</label>
          <input type="tel" id="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label for="purpose">Purpose *</label>
          <select id="purpose" required>
            <option value="">Select purpose</option>
            <option value="Delivery">Delivery</option>
            <option value="Meeting">Meeting</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Interview">Interview</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" placeholder="Enter company name">
        </div>

        <div class="form-group">
          <label for="aadhaarNumber">Aadhaar Number (Last 4 digits)</label>
          <input type="text" id="aadhaarNumber" placeholder="XXXX" maxlength="4">
        </div>

        <button type="submit" style="margin-top: 24px;">Submit Entry</button>
      </form>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    let mediaStream = null;
    let currentCaptureType = null;
    let aadhaarFrontBase64 = null;
    let aadhaarBackBase64 = null;
    let fullAadhaarNumber = '';

    const video = document.getElementById('cameraVideo');
    const canvas = document.getElementById('capturedCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const stopCameraBtn = document.getElementById('stopCameraBtn');
    const ocrStatus = document.getElementById('ocrStatus');
    const cameraSection = document.getElementById('cameraSection');
    const vendorForm = document.getElementById('vendorForm');

    document.getElementById('aadhaarNumber').addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 4) value = value.slice(0, 4);
      e.target.value = value;
    });

    async function startCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } 
        });
        video.srcObject = mediaStream;
        
        captureBtn.style.display = 'block';
        stopCameraBtn.style.display = 'block';
      } catch (error) {
        alert('Unable to access camera: ' + error.message);
      }
    }

    function stopCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      canvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      stopCameraBtn.style.display = 'none';
    }

    function captureImage() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      
      video.style.display = 'none';
      canvas.style.display = 'block';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    function retake() {
      canvas.style.display = 'none';
      video.style.display = 'block';
      captureBtn.style.display = 'block';
      retakeBtn.style.display = 'none';
    }

    function showForm() {
      cameraSection.style.display = 'none';
      vendorForm.style.display = 'block';
    }

    async function performOCR(imageData) {
      ocrStatus.style.display = 'block';
      ocrStatus.textContent = 'Processing OCR...';
      
      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(imageData);
        
        const text = ret.data.text;
        console.log('OCR Text:', text);
        
        const aadhaarRegex = /\d{4}\s*\d{4}\s*\d{4}/;
        const aadhaarMatch = text.match(aadhaarRegex);
        
        if (aadhaarMatch) {
          fullAadhaarNumber = aadhaarMatch[0].replace(/\s/g, '');
          const lastFour = fullAadhaarNumber.slice(-4);
          document.getElementById('aadhaarNumber').value = lastFour;
        }
        
        const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        
        let foundName = '';
        
        const namePatterns = [
          /(?:Name|नाम)\s*[:\s]\s*([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})/i,
          /(?:Name|नाम)\s*[:\s]\s*([A-Z\s]{3,})/
        ];
        
        for (const pattern of namePatterns) {
          const match = text.match(pattern);
          if (match && match[1].trim().length > 2) {
            foundName = match[1].trim();
            break;
          }
        }
        
        if (!foundName) {
          const nameKeywords = ['name', 'नाम'];
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].toLowerCase();
            if (nameKeywords.some(keyword => line.includes(keyword))) {
              const match = lines[i].match(/[:\s]([A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,3})/);
              if (match) {
                foundName = match[1].trim();
                break;
              }
              if (i + 1 < lines.length) {
                const nextLine = lines[i + 1].trim();
                if (/^[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*$/.test(nextLine)) {
                  foundName = nextLine;
                  break;
                }
              }
            }
          }
        }
        
        if (!foundName) {
          for (const line of lines) {
            if (/^[A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3}$/.test(line)) {
              if (!line.includes('Government') && 
                  !line.includes('INDIA') && 
                  !line.includes('Aadhaar') &&
                  !line.includes('Unique') &&
                  !line.includes('Identification')) {
                foundName = line;
                break;
              }
            }
          }
        }
        
        if (foundName && !document.getElementById('name').value) {
          document.getElementById('name').value = foundName;
        }
        
        await worker.terminate();
        
        if (foundName || aadhaarMatch) {
          ocrStatus.textContent = 'OCR Complete! Name and Aadhaar extracted.';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
            showForm();
          }, 1500);
        } else {
          ocrStatus.textContent = 'OCR Complete. Some fields may need manual entry.';
          setTimeout(() => {
            ocrStatus.style.display = 'none';
          }, 2000);
        }
        
      } catch (error) {
        console.error('OCR Error:', error);
        ocrStatus.textContent = 'OCR failed - you can enter details manually';
        setTimeout(() => {
          ocrStatus.style.display = 'none';
        }, 3000);
      }
    }

    document.getElementById('startFrontCamera').addEventListener('click', async () => {
      currentCaptureType = 'front';
      await startCamera();
    });

    document.getElementById('startBackCamera').addEventListener('click', async () => {
      currentCaptureType = 'back';
      await startCamera();
    });

    captureBtn.addEventListener('click', () => {
      const imageData = captureImage();
      const base64 = imageData.split(',')[1];
      
      if (currentCaptureType === 'front') {
        aadhaarFrontBase64 = base64;
        document.getElementById('frontPreview').src = imageData;
      } else {
        aadhaarBackBase64 = base64;
        document.getElementById('backPreview').src = imageData;
      }
      
      document.getElementById('aadhaarPreview').style.display = 'flex';
      
      if (currentCaptureType === 'front') {
        performOCR(imageData);
      }
    });

    retakeBtn.addEventListener('click', retake);
    stopCameraBtn.addEventListener('click', stopCamera);

    document.getElementById('skipScanBtn').addEventListener('click', () => {
      stopCamera();
      showForm();
    });

    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('successMsg');
      const errorMsg = document.getElementById('errorMsg');
      
      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      try {
        const aadhaarLastFour = document.getElementById('aadhaarNumber').value;
        let storedAadhaar = null;
        
        if (aadhaarLastFour && aadhaarLastFour.length === 4) {
          if (fullAadhaarNumber && fullAadhaarNumber.endsWith(aadhaarLastFour)) {
            storedAadhaar = fullAadhaarNumber;
          } else {
            storedAadhaar = 'XXXXXXXX' + aadhaarLastFour;
          }
        }

        await API.createVendorEntry({
          name: document.getElementById('name').value,
          mobile: document.getElementById('mobile').value,
          purpose: document.getElementById('purpose').value,
          companyName: document.getElementById('companyName').value || null,
          aadhaarNumber: storedAadhaar,
          aadhaarFront: aadhaarFrontBase64,
          aadhaarBack: aadhaarBackBase64
        });

        successMsg.style.display = 'block';
        e.target.reset();
        aadhaarFrontBase64 = null;
        aadhaarBackBase64 = null;
        fullAadhaarNumber = '';
        document.getElementById('aadhaarPreview').style.display = 'none';
        document.getElementById('frontPreview').src = '';
        document.getElementById('backPreview').src = '';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);
      } catch (error) {
        errorMsg.textContent = error.message || 'Failed to create entry';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
